<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FloorCast — Manufacturing Digital Twin POC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e1a;--panel-bg:rgba(10,18,35,0.92);--border:rgba(0,180,255,0.25);
  --cyan:#00c8ff;--green:#00ff88;--amber:#ffaa00;--red:#ff3333;
  --text:#c8d8f0;--dim:#4a6080;--radius:6px;
}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'Inter','Segoe UI',system-ui,sans-serif;color:var(--text)}
#app{
  display:grid;
  grid-template:"header header" 48px "canvas sidebar" 1fr "scrub sidebar" 80px / 1fr 280px;
  height:100vh;
}
#header{
  grid-area:header;display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;background:rgba(8,14,28,0.95);border-bottom:1px solid var(--border);z-index:10;
}
#header h1{font-size:15px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan)}
.status-bar{display:flex;gap:20px;font-size:12px;color:var(--dim)}
.status-bar span b{color:var(--text)}
#canvas-wrap{grid-area:canvas;position:relative;overflow:hidden}
#canvas-wrap canvas{display:block}
#scrubber{
  grid-area:scrub;display:flex;align-items:center;gap:12px;padding:0 20px;
  background:var(--panel-bg);border-top:1px solid var(--border);
}
#play-btn{
  background:none;border:1px solid var(--cyan);color:var(--cyan);
  width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:14px;flex-shrink:0;
}
#play-btn:hover{background:rgba(0,200,255,.1)}
#day-label{font-size:12px;color:var(--cyan);white-space:nowrap;min-width:150px}
#time-slider{
  flex:1;-webkit-appearance:none;height:4px;border-radius:2px;
  background:linear-gradient(to right,var(--cyan) 0%,#1a2a4a 0%);outline:none;cursor:pointer;
}
#time-slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--cyan);box-shadow:0 0 8px var(--cyan);cursor:pointer;
}
.scrub-label{font-size:11px;color:var(--dim)}
#sidebar{
  grid-area:sidebar;display:flex;flex-direction:column;background:var(--panel-bg);
  border-left:1px solid var(--border);overflow-y:auto;padding:16px 14px;gap:18px;
}
.sidebar-section{display:flex;flex-direction:column;gap:10px}
.sidebar-title{
  font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--cyan);border-bottom:1px solid var(--border);padding-bottom:6px;
}
.lever-row{display:flex;align-items:center;gap:8px;font-size:12px}
.lever-label{flex:1;color:var(--text)}
.lever-hint{font-size:11px;color:var(--green);min-width:40px;text-align:right}
.toggle-wrap{position:relative;display:inline-flex;cursor:pointer}
.toggle-wrap input{opacity:0;width:0;height:0;position:absolute}
.toggle-track{
  width:36px;height:18px;background:#1a2a3a;border:1px solid var(--border);
  border-radius:9px;transition:background .2s;position:relative;
}
.toggle-thumb{
  position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;
  background:var(--dim);transition:transform .2s,background .2s;
}
.toggle-wrap input:checked+.toggle-track{background:rgba(0,200,255,.15);border-color:var(--cyan)}
.toggle-wrap input:checked+.toggle-track .toggle-thumb{transform:translateX(18px);background:var(--cyan)}
select,input[type="date"]{
  width:100%;background:#0d1526;border:1px solid var(--border);color:var(--text);
  padding:5px 8px;border-radius:var(--radius);font-size:12px;outline:none;font-family:inherit;
}
select:focus,input:focus{border-color:var(--cyan)}
.date-row{display:flex;gap:6px}
.date-row input{flex:1}
.btn{
  width:100%;padding:7px 0;border:1px solid var(--cyan);background:rgba(0,200,255,.08);
  color:var(--cyan);border-radius:var(--radius);font-size:12px;font-family:inherit;
  cursor:pointer;transition:background .15s;
}
.btn:hover{background:rgba(0,200,255,.18)}
.btn.applied{border-color:var(--green);color:var(--green);background:rgba(0,255,136,.08)}
.btn.danger{border-color:var(--red);color:var(--red);background:rgba(255,50,50,.06)}
.btn.danger:hover{background:rgba(255,50,50,.14)}
/* CSS2D badges */
.machine-badge{display:flex;flex-direction:column;align-items:center;pointer-events:none;user-select:none}
.badge-name{
  background:rgba(8,16,30,.88);border:1px solid rgba(0,180,255,.35);color:#c8d8f0;
  font-size:9px;padding:2px 6px;border-radius:3px;white-space:nowrap;letter-spacing:.04em;font-family:inherit;
}
.badge-util{font-size:10px;font-weight:700;margin-top:2px;font-family:inherit}
#active-mutations{display:flex;flex-direction:column;gap:4px}
.mutation-chip{
  font-size:11px;background:rgba(0,200,255,.08);border:1px solid var(--border);
  border-radius:4px;padding:3px 8px;color:var(--text);
}
.mutation-chip.empty{color:var(--dim);font-style:italic}
</style>
</head>
<body>
<div id="app">
  <header id="header">
    <h1>⬡ FloorCast &mdash; Digital Twin POC</h1>
    <div class="status-bar">
      <span>Machines: <b>8</b></span>
      <span>Jobs Active: <b>12</b></span>
      <span id="bottleneck-status">Bottlenecks: <b style="color:#ff3333">3</b></span>
    </div>
  </header>
  <div id="canvas-wrap"><canvas id="main-canvas"></canvas></div>
  <div id="scrubber">
    <button id="play-btn">▶</button>
    <span class="scrub-label">Now</span>
    <input type="range" id="time-slider">
    <span class="scrub-label">+6 Weeks</span>
    <span id="day-label"></span>
  </div>
  <aside id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-title">Active Scenario</div>
      <div id="active-mutations"><div class="mutation-chip empty">No changes — showing base schedule</div></div>
      <button class="btn danger" id="reset-btn">Reset All Changes</button>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-title">Add Evening Shift (+8h/day)</div>
      <div id="shift-levers"></div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-title">Move Job to Different Machine</div>
      <select id="job-select"></select>
      <select id="target-machine-select"><option value="">— pick target —</option></select>
      <button class="btn" id="move-job-btn">Move Job</button>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-title">Schedule Downtime / Maintenance</div>
      <select id="downtime-machine-select"></select>
      <div class="date-row">
        <input type="date" id="downtime-start">
        <input type="date" id="downtime-end">
      </div>
      <button class="btn" id="downtime-btn">Add Downtime</button>
    </div>
  </aside>
</div>

  THREE.Object3D.call(this);
  this.element=element; this.element.style.position='absolute'; this.element.style.userSelect='none';
  this.addEventListener('removed',function(){this.traverse(function(object){if(object.element instanceof Element&&object.element.parentNode!==null) object.element.parentNode.removeChild(object.element);});});
};
THREE.CSS2DObject.prototype=Object.assign(Object.create(THREE.Object3D.prototype),{
  constructor:THREE.CSS2DObject,
  copy:function(source,recursive){THREE.Object3D.prototype.copy.call(this,source,recursive);this.element=source.element.cloneNode(true);return this},
  isCSS2DObject:true
});
THREE.CSS2DRenderer=function(){
  var _this=this; var _width,_height,_widthHalf,_heightHalf;
  var cache={objects:new WeakMap()};
  var domElement=document.createElement('div'); domElement.style.overflow='hidden';
  this.domElement=domElement;
  this.getSize=function(){return{width:_width,height:_height}};
  this.render=function(scene,camera){
    var frustum=new THREE.Frustum();
    var _projScreenMatrix=new THREE.Matrix4();
    return function render(scene,camera){
      _projScreenMatrix.multiplyMatrices(camera.projectionMatrix,camera.matrixWorldInverse);
      frustum.setFromProjectionMatrix(_projScreenMatrix);
      _this.renderObject(scene,scene,camera,frustum);
      zOrder(scene);
    };
  }();
  this.renderObject=function(object,scene,camera,frustum){
    if(object.isCSS2DObject){object.onBeforeRender(_this,scene,camera,null,null,null);var vector=new THREE.Vector3();var visible=(object.visible===true)&&(object.layers.test(camera.layers));var element=object.element;if(visible===true){object.getWorldPosition(vector);vector.project(camera);vector.x=vector.x*_widthHalf+_widthHalf;vector.y=-(vector.y*_heightHalf)+_heightHalf;object.element.style.transform='translate(-50%,-50%) translate('+vector.x+'px,'+vector.y+'px)';object.element.style.display='';if(element.parentNode!==domElement){domElement.appendChild(element)}}else{element.style.display='none';}object.onAfterRender(_this,scene,camera,null,null,null);}
    for(var i=0,l=object.children.length;i<l;i++) _this.renderObject(object.children[i],scene,camera,frustum);
  };
  function zOrder(scene){var sprites=filterAndFlatten(scene),zMax=findMax(sprites,function(o){return o.renderOrder;});for(var i=0,l=sprites.length;i<l;i++){sprites[i].element.style.zIndex=zMax-sprites[i].renderOrder}}
  function filterAndFlatten(scene){var result=[];scene.traverse(function(object){if(object.isCSS2DObject) result.push(object);});return result}
  function findMax(array,func){var max=0;for(var i=0,l=array.length;i<l;i++){var value=func(array[i]);if(value>max) max=value;}return max}
  this.setSize=function(width,height){_width=width;_height=height;_widthHalf=_width/2;_heightHalf=_height/2;domElement.style.width=width+'px';domElement.style.height=height+'px';};
};

var DEPT_COLORS={Turning:0x00c8ff,Milling:0x9b5de5,Inspect:0x00f5d4,Finish:0xf7b731};
var MACHINES=[
  {id:'M1',name:'Lathe #1', dept:'Turning',x:-5,z:-3},
  {id:'M2',name:'Lathe #2', dept:'Turning',x:-5,z: 0},
  {id:'M3',name:'VMC #1',   dept:'Milling',x:-1,z:-3},
  {id:'M4',name:'VMC #2',   dept:'Milling',x:-1,z: 0},

  {id:'M6',name:'CMM',      dept:'Inspect',x: 3,z:-1.5},

];

  {dept:'Turning',x:-5,z:-1.5,w:3.5,d:5},
  {dept:'Milling',x:-1,z: 0,  w:3.5,d:9},

];

// ═══════════════════════════════════════════════════════════════
// SCHEDULE ENGINE
// ═══════════════════════════════════════════════════════════════
var TOTAL_DAYS=42;
function clamp(v){return Math.min(1,Math.max(0,v))}
function buildBase(){
  function m3arr(){return Array.from({length:TOTAL_DAYS},function(_,i){
    if(i<3)  return 0.55;
    if(i<7)  return 0.55+(i-3)*0.10;
    if(i<14) return clamp(0.95+(i-7)*0.015);
    if(i<21) return 0.90-(i-14)*0.06;
    return clamp(0.45+Math.sin(i*0.25)*0.1);
  });}
  function m6arr(){return Array.from({length:TOTAL_DAYS},function(_,i){
    if(i<6)  return 0.4;
    if(i<10) return 0.4+(i-6)*0.12;
    if(i<18) return clamp(0.88+(i-10)*0.01);
    if(i<24) return 0.88-(i-18)*0.07;
    return 0.35+Math.sin(i*0.2)*0.1;
  });}
  function ramp(s,p,n){return Array.from({length:n},function(_,i){
    if(i<s) return 0.3+(i/s)*(p-0.3);
    if(i<p) return p-((i-s)/(n*0.6-s))*(p-0.5);
    return Math.max(0.25,0.5-((i-p)/(n-p))*0.25);
  });}
  return {
    M1:ramp(3,9,TOTAL_DAYS).map(function(v,i){return clamp(v*(i<10?0.95:0.7))}),
    M2:ramp(5,12,TOTAL_DAYS).map(function(v){return clamp(v*0.8)}),
    M3:m3arr(),
    M4:ramp(2,8,TOTAL_DAYS).map(function(v){return clamp(v*0.85)}),
    M5:ramp(6,14,TOTAL_DAYS).map(function(v){return clamp(v*0.65)}),
    M6:m6arr(),
    M7:Array.from({length:TOTAL_DAYS},function(_,i){return clamp(0.3+Math.sin(i*0.4)*0.2)}),
    M8:Array.from({length:TOTAL_DAYS},function(_,i){return clamp(0.25+Math.sin(i*0.3+1)*0.15)}),
  };
}
var BASE_SCHEDULE=buildBase();

function computeSchedule(mutations){
  var result={};
  Object.keys(BASE_SCHEDULE).forEach(function(id){result[id]=BASE_SCHEDULE[id].slice();});
  mutations.forEach(function(m){
    if(m.type==='shift') applyShift(result,m);
    else if(m.type==='moveJob') applyMoveJob(result,m);
    else if(m.type==='downtime') applyDowntime(result,m);
  });
  return result;
}
function applyShift(s,m){
  var arr=s[m.machineId], ds=DOWNSTREAM[m.machineId]||[];
  for(var d=m.startDay;d<=Math.min(m.endDay,TOTAL_DAYS-1);d++){
    var before=arr[d]; arr[d]=clamp(arr[d]*m.capacityMultiplier);
    var freed=before-arr[d];
    ds.forEach(function(mid,idx){var lag=idx+1; if(d+lag<TOTAL_DAYS&&freed>0) s[mid][d+lag]=clamp(s[mid][d+lag]-freed*0.5);});
  }
}
function applyMoveJob(s,m){
  var job=JOBS.filter(function(j){return j.id===m.jobId})[0]; if(!job) return;
  for(var d=0;d<TOTAL_DAYS;d++){
    s[job.fromMachine][d]=clamp(s[job.fromMachine][d]-job.load*0.8);
    s[m.toMachineId][d]=clamp(s[m.toMachineId][d]+job.load*0.85);
  }
}
function applyDowntime(s,m){
  var arr=s[m.machineId];
  for(var d=m.startDay;d<=Math.min(m.endDay,TOTAL_DAYS-1);d++) arr[d]=0;
  for(var d2=Math.max(0,m.startDay-3);d2<m.startDay;d2++) arr[d2]=clamp(arr[d2]+0.25);
  for(var d3=m.endDay+1;d3<=Math.min(m.endDay+4,TOTAL_DAYS-1);d3++) arr[d3]=clamp(arr[d3]+0.3);
}

// ═══════════════════════════════════════════════════════════════
// 3D SCENE
// ═══════════════════════════════════════════════════════════════
var COLOR_IDLE=new THREE.Color(0x00ff88);
var COLOR_BUSY=new THREE.Color(0xffaa00);
var COLOR_OVER=new THREE.Color(0xff2222);
var COLOR_DOWN=new THREE.Color(0x334455);

function heatColor(u){
  if(u<=0) return COLOR_DOWN.clone();
  var c=new THREE.Color();
  if(u<0.5) c.lerpColors(COLOR_IDLE,COLOR_BUSY,u/0.5);
  else c.lerpColors(COLOR_BUSY,COLOR_OVER,(u-0.5)/0.5);
  return c;
}
function utilLabel(u){
  if(u<=0) return '<span style="color:#6688aa">OFFLINE</span>';
  var p=Math.round(u*100);
  if(u>0.85) return '<span style="color:#ff4444">'+p+'% ▲</span>';
  if(u>0.6)  return '<span style="color:#ffaa00">'+p+'%</span>';
  return '<span style="color:#00cc66">'+p+'%</span>';
}

var canvas=document.getElementById('main-canvas');
var wrap=document.getElementById('canvas-wrap');

var scene=new THREE.Scene();
scene.background=new THREE.Color(0x0a0e1a);
scene.fog=new THREE.FogExp2(0x0a0e1a,0.02);

function W(){return wrap.offsetWidth||window.innerWidth-280}
function H(){return wrap.offsetHeight||window.innerHeight-128}

var camera=new THREE.PerspectiveCamera(35,W()/H(),0.1,200);
camera.position.set(16,14,16);
camera.lookAt(new THREE.Vector3(0,0,0));

var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(W(),H());
renderer.shadowMap.enabled=true;

var labelRenderer=new THREE.CSS2DRenderer();
labelRenderer.setSize(W(),H());
labelRenderer.domElement.style.cssText='position:absolute;top:0;left:0;pointer-events:none;width:'+W()+'px;height:'+H()+'px;';
wrap.appendChild(labelRenderer.domElement);

var controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=6; controls.maxDistance=40; controls.maxPolarAngle=Math.PI/2.2;

// Lights
var amb=new THREE.AmbientLight(0x1a2a4a,2.5); scene.add(amb);
var key=new THREE.DirectionalLight(0xffffff,2.0);
key.position.set(10,15,8); key.castShadow=true; key.shadow.mapSize.width=2048; key.shadow.mapSize.height=2048;
scene.add(key);
var fill=new THREE.DirectionalLight(0x4466aa,0.6); fill.position.set(-8,6,-6); scene.add(fill);

// Floor
var floor=new THREE.Mesh(new THREE.PlaneGeometry(32,22),new THREE.MeshStandardMaterial({color:0x0d1526,roughness:.9,metalness:.1}));
floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);

// Grid
var gpts=[];
for(var gi=-15;gi<=15;gi++){gpts.push(gi,0.01,-11,gi,0.01,11);gpts.push(-15,0.01,gi,15,0.01,gi);}
var gg=new THREE.BufferGeometry(); gg.setAttribute('position',new THREE.Float32BufferAttribute(gpts,3));
scene.add(new THREE.LineSegments(gg,new THREE.LineBasicMaterial({color:0x1a2a4a,transparent:true,opacity:.45})));

// Dept areas
DEPT_AREAS.forEach(function(a){
  var color=DEPT_COLORS[a.dept];
  var geo=new THREE.PlaneGeometry(a.w,a.d);
  var mesh=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:color,transparent:true,opacity:.07,depthWrite:false}));
  mesh.rotation.x=-Math.PI/2; mesh.position.set(a.x,.02,a.z); scene.add(mesh);
  var edges=new THREE.LineSegments(new THREE.EdgesGeometry(geo),new THREE.LineBasicMaterial({color:color,transparent:true,opacity:.22}));
  edges.rotation.x=-Math.PI/2; edges.position.set(a.x,.03,a.z); scene.add(edges);
});

// Machines
var machineObjects={};
MACHINES.forEach(function(m){
  var color=DEPT_COLORS[m.dept];
  var body=new THREE.Mesh(new THREE.BoxGeometry(1.2,.7,1.2),new THREE.MeshStandardMaterial({color:0x162030,roughness:.7,metalness:.4}));
  body.castShadow=true; body.receiveShadow=true;
  var topMat=new THREE.MeshStandardMaterial({color:0x00ff88,emissive:new THREE.Color(0x00ff88),emissiveIntensity:.4,roughness:.4,metalness:.6});
  var top=new THREE.Mesh(new THREE.BoxGeometry(1.1,.05,1.1),topMat); top.position.y=0.375;
  var strip=new THREE.Mesh(new THREE.BoxGeometry(1.22,.06,.12),new THREE.MeshStandardMaterial({color:color,emissive:new THREE.Color(color),emissiveIntensity:.6}));
  strip.position.set(0,-.15,.55);
  var group=new THREE.Group(); group.add(body,top,strip); group.position.set(m.x,.35,m.z); scene.add(group);
  var badge=document.createElement('div'); badge.className='machine-badge';
  badge.innerHTML='<span class="badge-name">'+m.name+'</span><span class="badge-util">—</span>';
  var label=new THREE.CSS2DObject(badge); label.position.set(0,1.1,0); group.add(label);
  machineObjects[m.id]={group:group,topMesh:top,badge:badge,utilValue:0,pulsePhase:Math.random()*Math.PI*2};
});

function setUtilization(utilMap){
  Object.keys(machineObjects).forEach(function(id){
    var obj=machineObjects[id]; var u=utilMap[id]!==undefined?utilMap[id]:0;
    obj.utilValue=u;
    var c=heatColor(u); obj.topMesh.material.color.copy(c); obj.topMesh.material.emissive.copy(c);
    obj.topMesh.material.emissiveIntensity=u>0.85?0.6:0.3;
    obj.badge.querySelector('.badge-util').innerHTML=utilLabel(u);
  });
}

window.addEventListener('resize',function(){
  camera.aspect=W()/H(); camera.updateProjectionMatrix();
  renderer.setSize(W(),H()); labelRenderer.setSize(W(),H());
});

var _pt=0;
function animate(){
  requestAnimationFrame(animate);
  controls.update(); _pt+=0.02;
  Object.values(machineObjects).forEach(function(obj){
    if(obj.utilValue>0.85) obj.topMesh.material.emissiveIntensity=0.3+0.5*(0.5+0.5*Math.sin(_pt*3+obj.pulsePhase));
  });
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
animate();

// ═══════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════
var mutations=[];
var currentSchedule=computeSchedule([]);
var currentDay=0;

function refresh(){
  var u={};
  Object.keys(currentSchedule).forEach(function(id){u[id]=currentSchedule[id][currentDay];});
  setUtilization(u);
  var bt=0;
  Object.values(currentSchedule).forEach(function(arr){if(arr[currentDay]>0.85) bt++;});
  var c=bt>2?'#ff3333':bt>0?'#ffaa00':'#00ff88';
  document.getElementById('bottleneck-status').innerHTML='Bottlenecks: <b style="color:'+c+'">'+bt+'</b>';
  var pct=currentDay/(TOTAL_DAYS-1)*100;
  slider.style.background='linear-gradient(to right,var(--cyan) '+pct+'%,#1a2a4a '+pct+'%)';
}

function recompute(){currentSchedule=computeSchedule(mutations);updateChips();refresh();}

function removeMutation(type,machineId,jobId){
  for(var i=mutations.length-1;i>=0;i--){
    var m=mutations[i]; if(m.type!==type) continue;
    if(machineId&&m.machineId!==machineId) continue;
    if(jobId&&m.jobId!==jobId) continue;
    mutations.splice(i,1);
  }
}

function updateChips(){
  var c=document.getElementById('active-mutations');
  if(!mutations.length){c.innerHTML='<div class="mutation-chip empty">No changes — showing base schedule</div>';return;}
  c.innerHTML=mutations.map(function(m){
    if(m.type==='shift')    return '<div class="mutation-chip">⬆ Evening shift: '+m.machineId+'</div>';
    if(m.type==='moveJob')  return '<div class="mutation-chip">⇄ '+m.jobId+' → '+m.toMachineId+'</div>';
    if(m.type==='downtime') return '<div class="mutation-chip">⏸ Downtime: '+m.machineId+' day '+m.startDay+'–'+m.endDay+'</div>';
    return '';
  }).join('');
}

// ─── Scrubber ────────────────────────────────────────────────────────────────
var slider=document.getElementById('time-slider');
var dayLabel=document.getElementById('day-label');
var playBtn=document.getElementById('play-btn');
slider.min=0; slider.max=TOTAL_DAYS-1; slider.value=0;

function dayToDate(d){var dt=new Date();dt.setDate(dt.getDate()+d);return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function updateDayLabel(d){dayLabel.textContent=d===0?'Today ('+dayToDate(0)+')':'Day '+d+' — '+dayToDate(d);}

slider.addEventListener('input',function(){
  currentDay=parseInt(slider.value); updateDayLabel(currentDay); refresh();
});

var playing=false,playInterval=null;
playBtn.addEventListener('click',function(){
  playing=!playing; playBtn.textContent=playing?'⏸':'▶';
  if(playing) playInterval=setInterval(function(){currentDay=(currentDay+1)%TOTAL_DAYS;slider.value=currentDay;updateDayLabel(currentDay);refresh();},120);
  else clearInterval(playInterval);
});
updateDayLabel(0);

// ─── Shift Levers ────────────────────────────────────────────────────────────
var shiftCont=document.getElementById('shift-levers');
MACHINES.forEach(function(m){
  var row=document.createElement('div'); row.className='lever-row';
  row.innerHTML='<label class="lever-label">'+m.name+'</label><label class="toggle-wrap"><input type="checkbox" class="shift-toggle" data-id="'+m.id+'"><span class="toggle-track"><span class="toggle-thumb"></span></span></label><span class="lever-hint" id="sh-'+m.id+'"></span>';
  shiftCont.appendChild(row);
});
shiftCont.addEventListener('change',function(e){
  var el=e.target; if(!el.classList.contains('shift-toggle')) return;
  var mid=el.dataset.id; removeMutation('shift',mid,null);
  if(el.checked){mutations.push({type:'shift',machineId:mid,startDay:0,endDay:TOTAL_DAYS-1,capacityMultiplier:0.62});document.getElementById('sh-'+mid).textContent='+8h/day';}
  else document.getElementById('sh-'+mid).textContent='';
  recompute();
});

// ─── Move Job ────────────────────────────────────────────────────────────────
var jobSel=document.getElementById('job-select');
var tgtSel=document.getElementById('target-machine-select');
jobSel.innerHTML='<option value="">— pick a job —</option>';
JOBS.forEach(function(j){jobSel.innerHTML+='<option value="'+j.id+'">'+j.name+' ('+j.fromMachine+')</option>';});
jobSel.addEventListener('change',function(){
  var job=JOBS.filter(function(j){return j.id===jobSel.value;})[0];
  tgtSel.innerHTML='<option value="">— pick target —</option>';
  if(job) MACHINES.filter(function(m){return m.id!==job.fromMachine;}).forEach(function(m){tgtSel.innerHTML+='<option value="'+m.id+'">'+m.name+'</option>';});
});
document.getElementById('move-job-btn').addEventListener('click',function(){
  var jobId=jobSel.value,toMachineId=tgtSel.value; if(!jobId||!toMachineId) return;
  removeMutation('moveJob',null,jobId); mutations.push({type:'moveJob',jobId:jobId,toMachineId:toMachineId});
  var btn=document.getElementById('move-job-btn'); btn.textContent='Applied ✓'; btn.classList.add('applied');
  setTimeout(function(){btn.textContent='Move Job';btn.classList.remove('applied');},1500);
  recompute();
});

// ─── Downtime ────────────────────────────────────────────────────────────────
var dtSel=document.getElementById('downtime-machine-select');
dtSel.innerHTML='<option value="">— pick machine —</option>';
MACHINES.forEach(function(m){dtSel.innerHTML+='<option value="'+m.id+'">'+m.name+'</option>';});
var today=new Date();
function fmt(d){return d.toISOString().split('T')[0];}
var s7=new Date(today); s7.setDate(today.getDate()+7);
var e9=new Date(today); e9.setDate(today.getDate()+9);
var dtStart=document.getElementById('downtime-start'); var dtEnd=document.getElementById('downtime-end');
dtStart.value=fmt(s7); dtEnd.value=fmt(e9); dtStart.min=fmt(today); dtEnd.min=fmt(today);
document.getElementById('downtime-btn').addEventListener('click',function(){
  var mid=dtSel.value; if(!mid) return;
  var origin=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  var sDay=Math.round((new Date(dtStart.value)-origin)/86400000);
  var eDay=Math.round((new Date(dtEnd.value)-origin)/86400000);
  if(sDay<0||eDay<sDay) return;
  removeMutation('downtime',mid,null); mutations.push({type:'downtime',machineId:mid,startDay:sDay,endDay:eDay});
  var btn=document.getElementById('downtime-btn'); btn.textContent='Applied ✓'; btn.classList.add('applied');
  setTimeout(function(){btn.textContent='Add Downtime';btn.classList.remove('applied');},1500);
  recompute();
});

// ─── Reset ───────────────────────────────────────────────────────────────────
document.getElementById('reset-btn').addEventListener('click',function(){
  mutations.length=0;
  document.querySelectorAll('.shift-toggle').forEach(function(el){el.checked=false;document.getElementById('sh-'+el.dataset.id).textContent='';});
  jobSel.value=''; tgtSel.innerHTML='<option value="">— pick target —</option>'; dtSel.value='';
  recompute();
});

refresh();
</script>
