<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuotePro — CNC Estimating</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f1f5f9;--surface:#fff;--sidebar:#1e2536;--sidebar-hover:#2a3347;
  --hdr:#0f1629;--text:#0f172a;--muted:#64748b;--light:#94a3b8;
  --border:#e2e8f0;--blue:#2563eb;--blue-lt:#eff6ff;
  --green:#16a34a;--green-lt:#f0fdf4;--amber:#d97706;--amber-lt:#fffbeb;
  --red:#dc2626;--red-lt:#fef2f2;
}
body{font-family:system-ui,-apple-system,sans-serif;font-size:13px;color:var(--text);
  background:var(--bg);height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ── HEADER ── */
.hdr{background:var(--hdr);color:#fff;padding:0 14px;height:50px;display:flex;
  align-items:center;gap:12px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.08)}
.logo{font-weight:800;font-size:14px;letter-spacing:-.3px;color:#fff;
  display:flex;align-items:center;gap:7px;flex-shrink:0}
.logo-icon{width:26px;height:26px;background:var(--blue);border-radius:5px;
  display:flex;align-items:center;justify-content:center;font-size:13px}
.hdr-sep{width:1px;height:22px;background:rgba(255,255,255,.12);flex-shrink:0}
.hdr-field{display:flex;flex-direction:column;gap:2px}
.hdr-field label{font-size:9px;text-transform:uppercase;letter-spacing:.8px;
  color:rgba(255,255,255,.38)}
.hdr-input{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
  border-radius:4px;color:#fff;font-size:12px;padding:3px 8px;outline:none;
  min-width:130px;font-family:inherit}
.hdr-input:focus{border-color:var(--blue);background:rgba(37,99,235,.18)}
.qty-grp{display:flex;gap:3px}
.qty-btn{padding:4px 11px;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);border-radius:4px;color:rgba(255,255,255,.65);
  cursor:pointer;font-size:12px;font-weight:600;transition:all .12s;font-family:inherit}
.qty-btn.active{background:var(--blue);border-color:var(--blue);color:#fff}
.qty-btn:hover:not(.active){background:rgba(255,255,255,.14)}
.hdr-spacer{flex:1}
.badge{padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:.5px}
.badge.wip{background:rgba(217,119,6,.22);color:#fbbf24}
.badge.ready{background:rgba(22,163,74,.22);color:#4ade80}
.hdr-btn{padding:5px 13px;border-radius:5px;font-size:12px;font-weight:600;
  cursor:pointer;border:none;transition:opacity .12s;font-family:inherit}
.hdr-btn.sec{background:rgba(255,255,255,.1);color:rgba(255,255,255,.8);
  border:1px solid rgba(255,255,255,.14)}
.hdr-btn.pri{background:var(--blue);color:#fff}
.hdr-btn:hover{opacity:.82}

/* ── WORKSPACE ── */
.workspace{display:flex;flex:1;overflow:hidden}

/* ── SIDEBAR ── */
.sidebar{width:224px;background:var(--sidebar);flex-shrink:0;
  display:flex;flex-direction:column;overflow:hidden}
.sb-hdr{padding:12px 14px 10px;border-bottom:1px solid rgba(255,255,255,.07)}
.sb-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;
  color:rgba(255,255,255,.32);margin-bottom:5px}
.sb-assy{font-size:13px;font-weight:700;color:rgba(255,255,255,.9);line-height:1.3}
.sb-pn{font-size:10px;color:rgba(255,255,255,.34);margin-top:2px}
.sb-scroll{flex:1;overflow-y:auto;padding:6px 0}
.sb-scroll::-webkit-scrollbar{width:3px}
.sb-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:2px}
.sec-hdr{padding:8px 14px 3px;font-size:9px;font-weight:700;text-transform:uppercase;
  letter-spacing:.7px;color:rgba(255,255,255,.28);display:flex;
  justify-content:space-between;align-items:center}
.sec-cnt{background:rgba(255,255,255,.1);padding:1px 6px;border-radius:10px;
  color:rgba(255,255,255,.38);font-size:9px}
.bom-item{padding:7px 12px;display:flex;align-items:center;gap:7px;cursor:pointer;
  border-left:2px solid transparent;transition:all .1s}
.bom-item:hover{background:var(--sidebar-hover)}
.bom-item.active{background:rgba(37,99,235,.22);border-left-color:var(--blue)}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot.ns{background:rgba(255,255,255,.18)}
.dot.rev{background:var(--amber);box-shadow:0 0 0 2px rgba(217,119,6,.25)}
.dot.ok{background:var(--green)}
.dot.flag{background:var(--red);box-shadow:0 0 0 2px rgba(220,38,38,.25)}
.bom-info{flex:1;min-width:0}
.bom-name{font-size:12px;font-weight:500;color:rgba(255,255,255,.75);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bom-item.active .bom-name{color:#fff}
.bom-pn{font-size:10px;color:rgba(255,255,255,.28);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bom-cost{font-size:11px;font-weight:700;color:rgba(255,255,255,.4);flex-shrink:0}
.bom-item.active .bom-cost{color:rgba(255,255,255,.85)}

/* ── MAIN ── */
.main{flex:1;overflow:hidden;display:flex;flex-direction:row}
.main-inner{flex:1;overflow:hidden;display:flex;flex-direction:column}

/* ── VIEWER PANEL ── */
.viewer-panel{width:360px;background:#111827;border-right:1px solid #0a0e18;
  flex-shrink:0;display:flex;flex-direction:column;overflow:hidden;
  transition:width .2s ease,border .2s ease}
.viewer-panel.closed{width:0;border-right:none}
.vp-tabs{display:flex;align-items:center;gap:0;background:#0f1729;
  border-bottom:1px solid rgba(255,255,255,.07);flex-shrink:0}
.vp-tab{padding:8px 14px;font-size:11px;font-weight:600;color:rgba(255,255,255,.4);
  cursor:pointer;border-bottom:2px solid transparent;transition:all .12s;white-space:nowrap}
.vp-tab:hover{color:rgba(255,255,255,.7)}
.vp-tab.active{color:#fff;border-bottom-color:var(--blue)}
.vp-filename{margin-left:auto;padding:0 12px;font-size:10px;color:rgba(255,255,255,.25);
  font-family:monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.vp-tools{display:flex;flex-direction:column;gap:1px;padding:6px 4px;
  background:#0f1729;border-right:1px solid rgba(255,255,255,.06);flex-shrink:0}
.vp-tool{width:28px;height:28px;display:flex;align-items:center;justify-content:center;
  border-radius:5px;cursor:pointer;font-size:13px;color:rgba(255,255,255,.35);
  transition:all .12s;border:1px solid transparent;user-select:none;title:attr(title)}
.vp-tool:hover{background:rgba(255,255,255,.08);color:rgba(255,255,255,.8);
  border-color:rgba(255,255,255,.1)}
.vp-tool.active-tool{background:rgba(37,99,235,.3);color:var(--blue);
  border-color:rgba(37,99,235,.4)}
.vp-tool-sep{height:1px;background:rgba(255,255,255,.07);margin:3px 2px}
.vp-viewport{flex:1;display:flex;position:relative;overflow:hidden}
.vp-canvas{flex:1;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:10px;position:relative}
.vp-placeholder-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:12px;pointer-events:none}
.vp-3d-label{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  color:rgba(255,255,255,.15)}
.vp-axis{position:absolute;bottom:12px;left:12px;display:flex;flex-direction:column;gap:2px}
.vp-axis-line{display:flex;align-items:center;gap:4px;font-size:9px;font-weight:700}
.vp-perf{position:absolute;top:8px;right:8px;font-size:9px;color:rgba(255,255,255,.18);
  font-family:monospace;text-align:right;line-height:1.6}
.vp-toggle-btn{padding:4px 10px;border-radius:5px;font-size:11px;font-weight:700;
  cursor:pointer;border:1px solid var(--border);background:#f1f5f9;
  color:var(--muted);transition:all .12s;font-family:inherit;
  display:flex;align-items:center;gap:5px;white-space:nowrap;flex-shrink:0}
.vp-toggle-btn:hover{background:var(--border);color:var(--text)}
.vp-toggle-btn.open{background:var(--blue-lt);border-color:var(--blue);color:var(--blue)}

/* ── PART HEADER ── */
.part-hdr{background:var(--surface);padding:14px 18px 0;
  border-bottom:1px solid var(--border);flex-shrink:0}
.part-hdr-top{display:flex;align-items:flex-start;gap:14px;margin-bottom:10px}
.part-thumb{width:62px;height:62px;background:#f8fafc;border:1px solid var(--border);
  border-radius:8px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;color:var(--light)}
.part-hdr-info{flex:1}
.type-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;
  border-radius:4px;font-size:9px;font-weight:700;text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:4px}
.type-badge.make{background:#eff6ff;color:#1d4ed8}
.type-badge.buy{background:#f0fdf4;color:#15803d}
.type-badge.osp{background:#fff7ed;color:#c2410c}
.part-name{font-size:18px;font-weight:800;color:var(--text);margin-bottom:3px;
  letter-spacing:-.3px}
.part-meta{display:flex;gap:14px;font-size:11px;color:var(--muted)}
.dfm-pills{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap;align-items:flex-start}
.dfm-pill{padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;
  display:flex;align-items:center;gap:3px}
.dfm-pill.critical{background:#fef2f2;color:#dc2626}
.dfm-pill.warning{background:#fffbeb;color:#d97706}
.dfm-pill.info{background:#eff6ff;color:#2563eb}
.tabs{display:flex}
.tab{padding:8px 15px;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;
  border-bottom:2px solid transparent;transition:all .12s;user-select:none}
.tab:hover{color:var(--text)}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.tab-body{flex:1;overflow-y:auto;padding:14px 18px}
.tab-body::-webkit-scrollbar{width:4px}
.tab-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.tab-pane{display:none}
.tab-pane.active{display:block}

/* ── CARDS ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;
  margin-bottom:12px;overflow:hidden}
.card-hdr{padding:10px 14px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;background:#fafbfc}
.card-title{font-size:11px;font-weight:700;color:var(--text);text-transform:uppercase;
  letter-spacing:.4px}
.card-body{padding:13px 14px}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.info-grid.two{grid-template-columns:1fr 1fr}
.info-item label{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.6px;
  color:var(--muted);margin-bottom:3px;font-weight:600}
.info-item .val{font-size:13px;font-weight:700;color:var(--text)}
.info-item .val.blue{color:var(--blue)}
.feat-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.feat-tag{padding:2px 7px;background:#f1f5f9;border:1px solid var(--border);
  border-radius:4px;font-size:10px;color:var(--muted);font-weight:500}
.tol-tag{background:#fffbeb;border-color:#fde68a;color:#92400e}

/* ── FORM CONTROLS ── */
.form-row{display:flex;gap:10px;align-items:flex-end;margin-bottom:10px}
.fg{display:flex;flex-direction:column;gap:3px}
.fg label{font-size:10px;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.5px}
.fc{padding:5px 9px;border:1px solid var(--border);border-radius:5px;
  font-size:12px;color:var(--text);background:var(--surface);outline:none;
  transition:border-color .12s;font-family:inherit}
.fc:focus{border-color:var(--blue)}
select.fc{cursor:pointer}

/* ── OPS TABLE ── */
.ops-wrap{overflow-x:auto}
.ops-table{width:100%;border-collapse:collapse;min-width:560px}
.ops-table th{padding:7px 9px;text-align:left;font-size:9px;font-weight:700;
  text-transform:uppercase;letter-spacing:.6px;color:var(--muted);
  border-bottom:1px solid var(--border);background:#fafbfc;white-space:nowrap}
.ops-table th.r,.ops-table td.r{text-align:right}
.ops-table td{padding:7px 9px;border-bottom:1px solid #f1f5f9;font-size:12px;
  vertical-align:middle}
.ops-table tr:last-child td{border-bottom:none}
.ops-table tr:hover td{background:#fafbfc}
.op-num{font-size:10px;font-weight:800;color:var(--muted);width:28px}
.ii{padding:3px 6px;border:1px solid transparent;border-radius:4px;
  font-size:12px;color:var(--text);background:transparent;outline:none;
  width:72px;text-align:right;transition:all .1s;font-family:inherit}
.ii:hover{border-color:var(--border);background:var(--surface)}
.ii:focus{border-color:var(--blue);background:var(--surface);
  box-shadow:0 0 0 2px rgba(37,99,235,.1)}
.ii.wide{width:95px;text-align:left}
.ii.name{width:140px;text-align:left}
select.ii{cursor:pointer;width:140px;text-align:left}
.op-cost-cell{font-weight:700;color:var(--text)}
.ops-table tfoot td{background:#fafbfc;border-top:2px solid var(--border);
  font-weight:700;font-size:12px}
.add-op{display:flex;align-items:center;gap:5px;padding:6px 12px;
  background:none;border:1px dashed var(--border);border-radius:5px;
  color:var(--muted);font-size:12px;cursor:pointer;width:100%;margin-top:8px;
  transition:all .12s;font-family:inherit}
.add-op:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-lt)}

/* ── DFM FLAGS ── */
.dfm-flag{padding:11px 13px;border-radius:7px;margin-bottom:8px;
  display:flex;align-items:flex-start;gap:9px;border:1px solid}
.dfm-flag.critical{background:#fef2f2;border-color:#fecaca}
.dfm-flag.warning{background:#fffbeb;border-color:#fde68a}
.dfm-flag.info{background:#eff6ff;border-color:#bfdbfe}
.dfm-icon{width:19px;height:19px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:10px;font-weight:800;flex-shrink:0;margin-top:1px}
.critical .dfm-icon{background:#dc2626;color:#fff}
.warning .dfm-icon{background:#d97706;color:#fff}
.info .dfm-icon{background:#2563eb;color:#fff}
.dfm-body{flex:1}
.dfm-desc{font-size:12px;font-weight:500;color:var(--text);margin-bottom:5px;
  line-height:1.4}
.dfm-actions{display:flex;align-items:center;gap:10px}
.dfm-cost-tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px}
.critical .dfm-cost-tag{background:#fecaca;color:#991b1b}
.warning .dfm-cost-tag{background:#fde68a;color:#92400e}
.info .dfm-cost-tag{background:#bfdbfe;color:#1e40af}
.toggle-wrap{display:flex;align-items:center;gap:5px;font-size:11px;
  color:var(--muted);cursor:pointer;user-select:none}
.tog{width:30px;height:16px;background:#cbd5e1;border-radius:8px;position:relative;
  transition:background .15s;cursor:pointer;flex-shrink:0}
.tog.on{background:var(--blue)}
.tog::after{content:'';position:absolute;width:12px;height:12px;background:#fff;
  border-radius:50%;top:2px;left:2px;transition:left .15s}
.tog.on::after{left:16px}

/* ── BUY / OSP VIEWS ── */
.buy-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.osp-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big-cost{font-size:28px;font-weight:800;color:var(--blue);letter-spacing:-1px}
.unit-sub{font-size:11px;color:var(--muted);margin-top:2px}

/* ── RIGHT PANEL ── */
.rp{width:256px;background:var(--surface);border-left:1px solid var(--border);
  flex-shrink:0;display:flex;flex-direction:column;overflow:hidden}
.rp-hdr{padding:12px 14px 10px;border-bottom:1px solid var(--border);background:#fafbfc}
.rp-title{font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.7px;color:var(--muted)}
.rp-scroll{flex:1;overflow-y:auto;padding:12px 14px}
.rp-scroll::-webkit-scrollbar{width:3px}
.rp-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.progress-bar-wrap{margin-bottom:14px}
.progress-label{display:flex;justify-content:space-between;font-size:11px;
  color:var(--muted);margin-bottom:5px}
.progress-label strong{color:var(--text)}
.pbar{height:5px;background:#e2e8f0;border-radius:3px;overflow:hidden}
.pbar-fill{height:100%;background:var(--blue);border-radius:3px;transition:width .3s}
.cost-sec{margin-bottom:14px}
.cost-sec-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;
  color:var(--muted);margin-bottom:7px}
.cost-line{display:flex;justify-content:space-between;align-items:center;
  padding:4px 0;font-size:12px;border-bottom:1px solid #f8fafc}
.cost-line:last-child{border-bottom:none}
.cost-line .lbl{color:var(--muted)}
.cost-line .lbl.active{color:var(--blue);font-weight:600}
.cost-line .amt{font-weight:700;color:var(--text)}
.cost-line .amt.active{color:var(--blue)}
.cost-div{border:none;border-top:1px solid var(--border);margin:10px 0}
.cost-total{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
.cost-total .lbl{font-size:13px;font-weight:700;color:var(--text)}
.cost-total .amt{font-size:16px;font-weight:800;color:var(--text)}
.margin-ctl{margin:12px 0 10px}
.margin-ctl label{display:flex;justify-content:space-between;font-size:11px;
  font-weight:600;color:var(--muted);margin-bottom:5px}
.margin-ctl label span{font-weight:800;color:var(--text)}
input[type=range]{width:100%;accent-color:var(--blue);cursor:pointer}
.price-box{background:linear-gradient(135deg,#1d4ed8,#2563eb);border-radius:8px;
  padding:13px 14px;color:#fff;margin-bottom:10px}
.price-box-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.7px;
  opacity:.65;margin-bottom:3px}
.price-box-val{font-size:26px;font-weight:800;letter-spacing:-1px}
.price-box-sub{font-size:10px;opacity:.6;margin-top:2px}
.lt-ctl label{font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.5px;color:var(--muted);display:block;margin-bottom:5px}
.lt-opts{display:flex;gap:4px;margin-bottom:14px}
.lt-btn{flex:1;padding:5px 3px;font-size:10px;font-weight:700;text-align:center;
  border:1px solid var(--border);border-radius:4px;cursor:pointer;
  color:var(--muted);background:var(--surface);transition:all .1s;font-family:inherit}
.lt-btn.active{background:var(--blue-lt);border-color:var(--blue);color:var(--blue)}
.lt-btn:hover:not(.active){background:#f8fafc}
.attn-hdr{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;
  color:var(--muted);margin-bottom:7px}
.attn-item{display:flex;align-items:center;gap:7px;padding:5px 0;
  border-bottom:1px solid #f1f5f9;font-size:11px;color:var(--muted);cursor:pointer}
.attn-item:hover{color:var(--blue)}
.attn-item:last-child{border-bottom:none}
.attn-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.gen-btn{width:100%;padding:10px;background:var(--blue);color:#fff;border:none;
  border-radius:7px;font-size:13px;font-weight:700;cursor:pointer;transition:all .12s;
  margin-top:6px;font-family:inherit;letter-spacing:-.2px}
.gen-btn:hover{background:#1d4ed8}
.empty-state{padding:40px 20px;text-align:center;color:var(--muted)}
.empty-state svg{opacity:.3;margin-bottom:10px}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <div class="logo">
    <div class="logo-icon">⚙</div>
    QuotePro
  </div>
  <div class="hdr-sep"></div>
  <div class="hdr-field">
    <label>Quote #</label>
    <input class="hdr-input" id="quoteNum" value="Q-2024-0891" style="min-width:100px">
  </div>
  <div class="hdr-field">
    <label>Customer</label>
    <input class="hdr-input" id="customer" value="Acme Aerospace LLC">
  </div>
  <div class="hdr-field">
    <label>Rev</label>
    <input class="hdr-input" id="rev" value="B" style="min-width:40px">
  </div>
  <div class="hdr-sep"></div>
  <div class="hdr-field">
    <label>Quantity</label>
    <div class="qty-grp" id="qtyGrp">
      <button class="qty-btn active" onclick="setQty(1)">1×</button>
      <button class="qty-btn" onclick="setQty(5)">5×</button>
      <button class="qty-btn" onclick="setQty(10)">10×</button>
    </div>
  </div>

// COST CALCULATIONS
// ─────────────────────────────────────────────
function calcMaterialCost(item) {
  const mat = MATERIALS[item.mat];
  if (!mat) return 0;
  const [w,h,l] = item.stock;
  return w * h * l * mat.density * mat.cpp * (item.scrap || 1.05);
}

function calcOpCost(op, qty) {
  return ((op.su / qty) + op.cy) * op.rate;
}

function calcMachiningCost(item, qty) {
  return item.ops.reduce((s, op) => s + calcOpCost(op, qty), 0);
}

function calcDFMCost(item) {
  return item.dfm.filter(f => f.on).reduce((s, f) => s + f.cost, 0);
}

function calcItemCost(item, qty) {
  if (item.type === 'make') {
    return calcMaterialCost(item) + calcMachiningCost(item, qty) + calcDFMCost(item);
  }
  return item.unitCost || 0;
}

function calcAll(qty) {
  const vals = Object.values(items);
  const make = vals.filter(i=>i.type==='make').reduce((s,i)=>s+calcItemCost(i,qty),0);
  const buy  = vals.filter(i=>i.type==='buy').reduce((s,i)=>s+calcItemCost(i,qty),0);
  const osp  = vals.filter(i=>i.type==='osp').reduce((s,i)=>s+calcItemCost(i,qty),0);
  return {make,buy,osp,total:make+buy+osp};
}

function quotePrice(cost) { return cost / (1 - state.margin); }

  const qty = state.qty;
  const machOpts = Object.keys(MACHINES).map(m=>
    `<option value="${m}">${m} ($${MACHINES[m]}/hr)</option>`
  ).join('');

  const rows = item.ops.map(op => {
    const cost = calcOpCost(op, qty);
    return `<tr data-op="${op.id}">
      <td class="op-num">${op.op}</td>
      <td><input class="ii name" value="${op.name}" data-field="name" data-op="${op.id}" data-id="${item.id}" onchange="updateOp(this)"></td>
      <td>
        <select class="ii" style="width:140px" data-field="mach" data-op="${op.id}" data-id="${item.id}" onchange="updateOp(this)">
          ${Object.keys(MACHINES).map(m=>`<option value="${m}"${op.mach===m?' selected':''}>${m}</option>`).join('')}
        </select>
      </td>
      <td class="r"><input class="ii" value="${op.su.toFixed(2)}" data-field="su" data-op="${op.id}" data-id="${item.id}" onchange="updateOp(this)"></td>
      <td class="r"><input class="ii" value="${op.cy.toFixed(3)}" data-field="cy" data-op="${op.id}" data-id="${item.id}" onchange="updateOp(this)"></td>
      <td class="r"><input class="ii" value="${op.rate}" data-field="rate" data-op="${op.id}" data-id="${item.id}" onchange="updateOp(this)"></td>
      <td class="r op-cost-cell" id="opc-${op.id}">$${cost.toFixed(2)}</td>
    </tr>`;
  }).join('');

  const machTotal = calcMachiningCost(item, qty);

  return `
  <div class="card">
    <div class="card-hdr">
      <span class="card-title">Operations (Qty ${qty}×)</span>
      <span style="font-size:11px;color:var(--muted)">Setup amortized over ${qty} pc${qty>1?'s':''}</span>
    </div>
    <div class="card-body" style="padding:0">
      <div class="ops-wrap">
        <table class="ops-table">
          <thead><tr>
            <th>Op</th><th>Name</th><th>Machine</th>
            <th class="r">Setup Hrs</th><th class="r">Cycle Hrs</th>
            <th class="r">Rate $/hr</th><th class="r">Cost/pc</th>
          </tr></thead>
          <tbody id="opRows-${item.id}">${rows}</tbody>
          <tfoot><tr>
            <td colspan="6" class="r" style="padding-right:9px">Total Machining</td>
            <td class="r" id="machTotal-${item.id}">$${machTotal.toFixed(2)}</td>
          </tr></tfoot>
        </table>
      </div>
      <div style="padding:8px 14px 12px">
        <button class="add-op" onclick="addOp('${item.id}')">+ Add Operation</button>
      </div>
    </div>
  </div>`;
}

// ── DFM Tab ──
function renderDFM(item) {
  const flags = item.dfm.map(f => `
    <div class="dfm-flag ${f.sev}" id="dfmflag-${f.id}">
      <div class="dfm-icon">${f.sev==='critical'?'!':f.sev==='warning'?'!':'i'}</div>
      <div class="dfm-body">
        <div class="dfm-desc">${f.desc}</div>
        <div class="dfm-actions">
          ${f.cost > 0 ? `<span class="dfm-cost-tag">+$${f.cost.toFixed(2)} cost impact</span>` : '<span style="font-size:11px;color:var(--muted)">No cost impact</span>'}
          <label class="toggle-wrap">
            <div class="tog ${f.on?'on':''}" id="tog-${f.id}" data-dfm="${f.id}" data-id="${item.id}" onclick="toggleDFM(this)"></div>
            <span>${f.on?'Included':'Excluded'}</span>
          </label>
        </div>
      </div>
    </div>`).join('');

  const total = calcDFMCost(item);
  return `
  <div class="card">
    <div class="card-hdr">
      <span class="card-title">DFM Analysis — ${item.dfm.length} Flag${item.dfm.length!==1?'s':''}</span>
      <span style="font-size:12px;font-weight:700;color:var(--blue)">DFM Cost: $<span id="dfmTotal-${item.id}">${total.toFixed(2)}</span></span>
    </div>
    <div class="card-body">${flags}</div>
  </div>`;
}

// ── Notes Tab ──
function renderNotes(item) {
  return `
  <div class="card">
    <div class="card-hdr"><span class="card-title">Quoter Notes</span></div>
    <div class="card-body">
      <textarea class="fc" id="notesArea-${item.id}" rows="6"
        style="width:100%;resize:vertical;font-size:12px;line-height:1.5"
        placeholder="Add notes, assumptions, vendor quotes, open questions…"
        onchange="items['${item.id}'].notes=this.value">${item.notes}</textarea>
    </div>
  </div>`;
}

// ── Buy Details ──
function renderBuyDetails(item) {
  return `
  <div class="card">
    <div class="card-hdr"><span class="card-title">Purchase Item</span></div>
    <div class="card-body">
      <div class="form-row">
        <div class="fg" style="flex:1">
          <label>Supplier</label>
          <input class="fc" id="buySupplier-${item.id}" value="${item.supplier}"
            onchange="items['${item.id}'].supplier=this.value;refreshAll()">
        </div>
      </div>
      <div class="fg" style="margin-bottom:12px">
        <label>Description</label>
        <input class="fc" style="width:100%" id="buyDesc-${item.id}" value="${item.desc}"
          onchange="items['${item.id}'].desc=this.value">
      </div>
      <div style="display:flex;align-items:flex-end;gap:16px">
        <div class="fg">
          <label>Unit Cost</label>
          <input class="fc" id="buyUnitCost-${item.id}" value="${item.unitCost.toFixed(2)}"
            style="width:100px" onchange="updateBuyCost('${item.id}',this.value)">
        </div>
        <div>
          <div class="big-cost" id="buyTotal-${item.id}">$${item.unitCost.toFixed(2)}</div>
          <div class="unit-sub">per assembly</div>
        </div>
      </div>
    </div>
  </div>`;
}

// ── OSP Details ──
function renderOSPDetails(item) {
  const procOpts = OSP_PROCESSES.map(p=>
    `<option${item.process===p?' selected':''}>${p}</option>`).join('');
  return `
  <div class="card">
    <div class="card-hdr"><span class="card-title">Outside Process</span></div>
    <div class="card-body">
      <div class="form-row">
        <div class="fg" style="flex:1">
          <label>Process</label>
          <select class="fc" id="ospProc-${item.id}" onchange="items['${item.id}'].process=this.value">${procOpts}</select>
        </div>
      </div>
      <div class="fg" style="margin-bottom:10px">
        <label>Spec / Drawing Callout</label>
        <input class="fc" style="width:100%" id="ospSpec-${item.id}" value="${item.spec}"
          onchange="items['${item.id}'].spec=this.value">
      </div>
      <div class="form-row">
        <div class="fg" style="flex:1">
          <label>Vendor</label>
          <input class="fc" id="ospVendor-${item.id}" value="${item.vendor}"
            onchange="items['${item.id}'].vendor=this.value">
        </div>
        <div class="fg">
          <label>Lead (days)</label>
          <input class="fc" id="ospLT-${item.id}" value="${item.ltDays}"
            style="width:80px" onchange="updateOSP('${item.id}','ltDays',this.value)">
        </div>
      </div>
      <div style="display:flex;align-items:flex-end;gap:16px;margin-top:8px">
        <div class="fg">
          <label>Unit Cost</label>
          <input class="fc" id="ospCost-${item.id}" value="${item.unitCost.toFixed(2)}"
            style="width:100px" onchange="updateOSP('${item.id}','unitCost',this.value)">
        </div>
        <div>
          <div class="big-cost" id="ospTotal-${item.id}">$${item.unitCost.toFixed(2)}</div>
          <div class="unit-sub">per assembly · ${item.ltDays} day lead</div>
        </div>
      </div>
    </div>
  </div>`;
}

// ─────────────────────────────────────────────
// RIGHT PANEL
// ─────────────────────────────────────────────
function renderRightPanel() {
  const qty = state.qty;
  const totals = calcAll(qty);
  const qp = quotePrice(totals.total);
  const pct = Math.round(state.margin * 100);

  const makeItems = Object.values(items).filter(i=>i.type==='make');
  const buyItems  = Object.values(items).filter(i=>i.type==='buy');
  const ospItems  = Object.values(items).filter(i=>i.type==='osp');

  const itemLine = (i) => {
    const cost = calcItemCost(i, qty);
    const isActive = state.activeId === i.id;
    return `<div class="cost-line" onclick="selectItem('${i.id}')" style="cursor:pointer">
      <span class="lbl${isActive?' active':''}">${i.name}</span>
      <span class="amt${isActive?' active':''}">$${cost.toFixed(2)}</span>
    </div>`;
  };

  const completed = Object.values(items).filter(i=>i.status==='complete').length;
  const totalItems = Object.values(items).length;
  const progPct = Math.round(completed/totalItems*100);

  const attnItems = Object.values(items).filter(i=>i.status==='not-started'||i.status==='review');
  const attnRows = attnItems.map(i=>`
    <div class="attn-item" onclick="selectItem('${i.id}')">
      <div class="attn-dot" style="background:${i.status==='review'?'var(--amber)':'var(--light)'}"></div>
      ${i.name}
    </div>`).join('');

  const ltOpts = ['1-2wk','3-4wk','6-8wk','Custom'];
  const ltBtns = ltOpts.map(o=>
    `<button class="lt-btn${state.leadTime===o?' active':''}" onclick="setLT('${o}')">${o}</button>`
  ).join('');

  document.getElementById('rpContent').innerHTML = `
    <div class="progress-bar-wrap">
      <div class="progress-label">
        <span>Items reviewed</span>
        <strong>${completed} / ${totalItems}</strong>
      </div>
      <div class="pbar"><div class="pbar-fill" style="width:${progPct}%"></div></div>
    </div>

    <div class="cost-sec">
      <div class="cost-sec-lbl">Make Items</div>
      ${makeItems.map(itemLine).join('')}
      <div class="cost-line" style="border-top:1px solid var(--border);margin-top:3px;padding-top:6px">
        <span class="lbl" style="font-weight:700;color:var(--text)">Subtotal</span>
        <span class="amt">$${totals.make.toFixed(2)}</span>
      </div>
    </div>

    <div class="cost-sec">
      <div class="cost-sec-lbl">Buy Items</div>
      ${buyItems.map(itemLine).join('')}
      <div class="cost-line" style="border-top:1px solid var(--border);margin-top:3px;padding-top:6px">
        <span class="lbl" style="font-weight:700;color:var(--text)">Subtotal</span>
        <span class="amt">$${totals.buy.toFixed(2)}</span>
      </div>
    </div>

    <div class="cost-sec">
      <div class="cost-sec-lbl">Outside Process</div>
      ${ospItems.map(itemLine).join('')}
      <div class="cost-line" style="border-top:1px solid var(--border);margin-top:3px;padding-top:6px">
        <span class="lbl" style="font-weight:700;color:var(--text)">Subtotal</span>
        <span class="amt">$${totals.osp.toFixed(2)}</span>
      </div>
    </div>

    <hr class="cost-div">
    <div class="cost-total">
      <span class="lbl">Total Cost</span>
      <span class="amt">$${totals.total.toFixed(2)}</span>
    </div>

    <div class="margin-ctl">
      <label>Margin <span id="marginPct">${pct}%</span></label>
      <input type="range" min="0" max="70" value="${pct}"
        oninput="setMargin(this.value/100)">
    </div>

    <div class="price-box">
      <div class="price-box-lbl">Quote Price (${qty}×)</div>
      <div class="price-box-val">$${qp.toFixed(2)}</div>
      <div class="price-box-sub">$${(qp/qty).toFixed(2)} per piece · ${pct}% margin</div>
    </div>

    <div class="lt-ctl">
      <label>Lead Time</label>
      <div class="lt-opts">${ltBtns}</div>
    </div>

    ${attnRows ? `<div class="attn-hdr">Needs Attention</div>${attnRows}` : ''}

    <button class="gen-btn" onclick="alert('PDF output coming soon')">Generate Quote PDF</button>`;
}

// ─────────────────────────────────────────────
// EVENT HANDLERS
// ─────────────────────────────────────────────
function selectItem(id) {
  state.activeId = id;
  state.activeTab = items[id].type === 'make' ? 'overview' :
                    items[id].type === 'buy'  ? 'details'  : 'details';
  refreshAll();
}

function setQty(q) {
  state.qty = q;
  document.querySelectorAll('.qty-btn').forEach(b=>b.classList.toggle('active', +b.textContent===q));
  refreshAll();
}

function setMargin(v) {
  state.margin = v;
  document.getElementById('marginPct').textContent = Math.round(v*100)+'%';
  renderRightPanel();
}

function setLT(v) { state.leadTime = v; renderRightPanel(); }

function switchTab(t) {
  state.activeTab = t;
  document.querySelectorAll('.tab').forEach(el => el.classList.toggle('active', el.textContent.toLowerCase()===t));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  const pane = document.getElementById('pane-'+t);
  if (pane) pane.classList.add('active');
}

function updateOp(el) {
  const id  = el.dataset.id;
  const opId = el.dataset.op;
  const field = el.dataset.field;
  const item = items[id];
  const op = item.ops.find(o=>o.id===opId);
  if (!op) return;
  if (field === 'name') op.name = el.value;
  else if (field === 'mach') { op.mach = el.value; op.rate = MACHINES[el.value] || op.rate; }
  else op[field] = parseFloat(el.value) || 0;
  refreshCosts(item);
}

function toggleDFM(el) {
  const id = el.dataset.id;
  const dfmId = el.dataset.dfm;
  const item = items[id];
  const flag = item.dfm.find(f=>f.id===dfmId);
  if (!flag) return;
  flag.on = !flag.on;
  el.classList.toggle('on', flag.on);
  el.nextElementSibling.textContent = flag.on ? 'Included' : 'Excluded';
  const totalEl = document.getElementById('dfmTotal-'+id);
  if (totalEl) totalEl.textContent = calcDFMCost(item).toFixed(2);
  refreshCosts(item);
}

function updateBuyCost(id, v) {
  items[id].unitCost = parseFloat(v) || 0;
  const el = document.getElementById('buyTotal-'+id);
  if (el) el.textContent = '$'+items[id].unitCost.toFixed(2);
  refreshCosts(items[id]);
}

function updateOSP(id, field, v) {
  items[id][field] = parseFloat(v) || 0;
  const el = document.getElementById('ospTotal-'+id);
  if (el) el.textContent = '$'+items[id].unitCost.toFixed(2);
  refreshCosts(items[id]);
}

function addOp(id) {
  const item = items[id];
  const lastOp = item.ops[item.ops.length-1];
  const nextNum = lastOp ? String(+lastOp.op+10).padStart(2,'0') : '10';
  item.ops.push({
    id:'o'+Date.now(), op:nextNum, name:'New Operation',
    mach:'3-Axis VMC', su:0.5, cy:0.5, rate:125
  });
  state.activeTab = 'operations';
  refreshAll();
}

function markComplete(id) {
  items[id].status = 'complete';
  refreshAll();
}

function refreshCosts(item) {
  const qty = state.qty;
  if (item.type === 'make') {
    item.ops.forEach(op => {
      const el = document.getElementById('opc-'+op.id);
      if (el) el.textContent = '$'+calcOpCost(op,qty).toFixed(2);
    });
    const mtEl = document.getElementById('machTotal-'+item.id);
    if (mtEl) mtEl.textContent = '$'+calcMachiningCost(item,qty).toFixed(2);
    const matEl = document.getElementById('matCostDisp');
    if (matEl) matEl.textContent = '$'+calcMaterialCost(item).toFixed(2);
  }
  renderBOM();
  renderRightPanel();
}

function refreshAll() {
  const item = items[state.activeId];
  renderBOM();
  renderPartHeader(item);
  renderTabBody(item);
  renderRightPanel();
}

// ── Material / stock listeners ──
function bindMaterialListeners(item) {
  if (item.type !== 'make') return;
  const matSel = document.getElementById('matSel');
  if (matSel) matSel.addEventListener('change', e => {
    items[item.id].mat = e.target.value;
    const mat = MATERIALS[e.target.value];
    const cppEl = document.getElementById('matCpp');
    if (cppEl && mat) cppEl.value = '$'+mat.cpp.toFixed(2);
    updateStockDisplay(item);
    refreshCosts(items[item.id]);
  });
  ['stockW','stockH','stockL','stockScrap'].forEach(fid => {
    const el = document.getElementById(fid);
    if (!el) return;
    el.addEventListener('change', () => {
      const w = parseFloat(document.getElementById('stockW')?.value)||0;
      const h = parseFloat(document.getElementById('stockH')?.value)||0;
      const l = parseFloat(document.getElementById('stockL')?.value)||0;
      const sc= parseFloat(document.getElementById('stockScrap')?.value)||1.05;
      items[item.id].stock = [w,h,l];
      items[item.id].scrap = sc;
      updateStockDisplay(items[item.id]);
      refreshCosts(items[item.id]);
    });
  });
}

function updateStockDisplay(item) {
  const mat = MATERIALS[item.mat];
  if (!mat) return;
  const [w,h,l] = item.stock;
  const wt = w*h*l*mat.density;
  const wtEl = document.getElementById('rawWt');
  const mcEl = document.getElementById('matCostDisp');
  if (wtEl) wtEl.textContent = wt.toFixed(2)+' lbs';
  if (mcEl) mcEl.textContent = '$'+calcMaterialCost(item).toFixed(2);
}

function bindOpsListeners(item) { /* inline onchange used */ }
function bindDFMListeners(item) { /* inline onclick used */ }
function bindBuyListeners(item) { /* inline onchange used */ }
function bindOSPListeners(item) { /* inline onchange used */ }

// ─────────────────────────────────────────────
// VIEWER PANEL
// ─────────────────────────────────────────────
function toggleViewer() {
  state.viewerOpen = !state.viewerOpen;
  const panel = document.getElementById('viewerPanel');
  panel.classList.toggle('closed', !state.viewerOpen);
  // Re-render header to flip button state
  renderPartHeader(items[state.activeId]);
  // Update filename in panel
  updateViewerMeta(items[state.activeId]);
}

function switchViewerTab(tab, el) {
  document.querySelectorAll('.vp-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  const canvas = document.getElementById('vpCanvas');
  const label  = document.getElementById('vpLabel');
  const fname  = document.getElementById('vpFilename');
  if (tab === 'pdf') {
    label.textContent = 'Blueprint PDF loads here';
    if (canvas) canvas.style.background = '#1e2030';
    if (fname) fname.textContent = items[state.activeId].pn + '_RevB.pdf';
  } else {
    label.textContent = 'STEP viewer loads here';
    if (canvas) canvas.style.background = '';
    if (fname) fname.textContent = items[state.activeId].pn + '_RevB.step';
  }
}

function updateViewerMeta(item) {
  const fname = document.getElementById('vpFilename');
  if (fname) fname.textContent = item.pn + '_RevB.step';
}

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
state.viewerOpen = false;
refreshAll();
</script>
</body>
</html>
