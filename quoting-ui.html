<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuotePro — CNC Estimating</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f1f5f9;--surface:#fff;--nav:#151c2b;--nav2:#1a2236;
  --hdr:#0d1320;--text:#0f172a;--muted:#64748b;--light:#94a3b8;
  --border:#e2e8f0;--blue:#2563eb;--blue-lt:#eff6ff;
  --green:#16a34a;--amber:#d97706;--red:#dc2626;
  --viewer:#0f1520;
}
body{font-family:system-ui,-apple-system,sans-serif;font-size:13px;color:var(--text);
  background:var(--bg);height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ── HEADER ── */
.hdr{background:var(--hdr);color:#fff;padding:0 14px;height:48px;display:flex;
  align-items:center;gap:12px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.07)}
.logo{font-weight:800;font-size:14px;color:#fff;display:flex;align-items:center;gap:7px;flex-shrink:0}
.logo-icon{width:24px;height:24px;background:var(--blue);border-radius:5px;
  display:flex;align-items:center;justify-content:center;font-size:12px}
.hdr-sep{width:1px;height:20px;background:rgba(255,255,255,.12);flex-shrink:0}
.hdr-field{display:flex;flex-direction:column;gap:1px}
.hdr-field label{font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:rgba(255,255,255,.35)}
.hdr-input{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
  border-radius:4px;color:#fff;font-size:12px;padding:2px 8px;outline:none;
  min-width:130px;font-family:inherit}
.hdr-input:focus{border-color:var(--blue)}
.qty-grp{display:flex;gap:3px}
.qty-btn{padding:3px 10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
  border-radius:4px;color:rgba(255,255,255,.6);cursor:pointer;font-size:12px;font-weight:600;
  transition:all .12s;font-family:inherit}
.qty-btn.active{background:var(--blue);border-color:var(--blue);color:#fff}
.qty-btn:hover:not(.active){background:rgba(255,255,255,.14)}
.hdr-spacer{flex:1}
.badge-wip{padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;
  text-transform:uppercase;background:rgba(217,119,6,.22);color:#fbbf24}
.badge-ok{padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;
  text-transform:uppercase;background:rgba(22,163,74,.22);color:#4ade80}
.hdr-btn{padding:5px 13px;border-radius:5px;font-size:12px;font-weight:600;
  cursor:pointer;border:none;font-family:inherit}
.hdr-btn.sec{background:rgba(255,255,255,.1);color:rgba(255,255,255,.75);
  border:1px solid rgba(255,255,255,.14)}
.hdr-btn.pri{background:var(--blue);color:#fff}
.hdr-btn:hover{opacity:.83}

/* ── WORKSPACE ── */
.workspace{display:flex;flex:1;overflow:hidden}

/* ── LEFT: STEP NAV ── */
.step-nav{width:210px;background:var(--nav);flex-shrink:0;display:flex;
  flex-direction:column;overflow:hidden;border-right:1px solid rgba(255,255,255,.06)}

.part-sel{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.07);
  cursor:pointer;position:relative}
.part-sel-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;
  color:rgba(255,255,255,.3);margin-bottom:4px}
.part-sel-name{font-size:13px;font-weight:700;color:rgba(255,255,255,.9);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.part-sel-pn{font-size:10px;color:rgba(255,255,255,.32);margin-top:1px}
.part-sel-arrow{position:absolute;right:12px;top:50%;transform:translateY(-50%);
  color:rgba(255,255,255,.25);font-size:11px}

/* part dropdown */
.part-dropdown{position:absolute;top:100%;left:0;right:0;background:#1e2847;
  border:1px solid rgba(255,255,255,.1);border-top:none;z-index:100;
  max-height:220px;overflow-y:auto;display:none}
.part-dropdown.open{display:block}
.pd-section{padding:5px 10px 3px;font-size:9px;font-weight:700;text-transform:uppercase;
  letter-spacing:.7px;color:rgba(255,255,255,.25)}
.pd-item{padding:7px 12px;display:flex;align-items:center;gap:7px;cursor:pointer;
  border-left:2px solid transparent}
.pd-item:hover,.pd-item.active{background:rgba(37,99,235,.2);border-left-color:var(--blue)}
.pd-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.pd-dot.ok{background:var(--green)}
.pd-dot.rev{background:var(--amber)}
.pd-dot.ns{background:rgba(255,255,255,.18)}
.pd-item-name{font-size:12px;color:rgba(255,255,255,.75);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;flex:1}
.pd-item.active .pd-item-name{color:#fff}
.pd-type{font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px}
.pd-type.make{background:#1d4ed8;color:rgba(255,255,255,.8)}
.pd-type.buy{background:#15803d;color:rgba(255,255,255,.8)}
.pd-type.osp{background:#c2410c;color:rgba(255,255,255,.8)}

/* step list */
.step-list{flex:1;overflow-y:auto;padding:6px 0}
.step-list::-webkit-scrollbar{width:3px}
.step-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}
.step-item{padding:8px 10px 8px 12px;display:flex;align-items:center;gap:9px;
  cursor:pointer;border-left:2px solid transparent;transition:all .1s;position:relative}
.step-item:hover{background:rgba(255,255,255,.05)}
.step-item.active{background:rgba(37,99,235,.18);border-left-color:var(--blue)}
.step-circle{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:9px;font-weight:800;flex-shrink:0;
  border:1.5px solid rgba(255,255,255,.15);color:rgba(255,255,255,.3);background:transparent;
  transition:all .15s}
.step-circle.ok{background:var(--green);border-color:var(--green);color:#fff}
.step-circle.active{background:var(--blue);border-color:var(--blue);color:#fff;
  box-shadow:0 0 0 3px rgba(37,99,235,.2)}
.step-circle.warn{background:var(--amber);border-color:var(--amber);color:#fff}
.step-circle.crit{background:var(--red);border-color:var(--red);color:#fff}
.step-info{flex:1;min-width:0}
.step-item-name{font-size:12px;font-weight:500;color:rgba(255,255,255,.65);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step-item.active .step-item-name{color:#fff;font-weight:600}
.step-item.ok .step-item-name{color:rgba(255,255,255,.55)}
.step-badges{display:flex;gap:3px;margin-top:2px}
.sbadge{font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;
  text-transform:uppercase;letter-spacing:.3px}
.sbadge.new{background:rgba(37,99,235,.3);color:#93c5fd}
.sbadge.update{background:rgba(217,119,6,.3);color:#fcd34d}
.sbadge.req{background:rgba(220,38,38,.3);color:#fca5a5}

/* cost footer */
.step-footer{padding:10px 12px;border-top:1px solid rgba(255,255,255,.07);flex-shrink:0}
.sf-label{font-size:9px;text-transform:uppercase;letter-spacing:.7px;
  color:rgba(255,255,255,.28);margin-bottom:4px}
.sf-cost{font-size:18px;font-weight:800;color:rgba(255,255,255,.9);letter-spacing:-.5px}
.sf-sub{font-size:10px;color:rgba(255,255,255,.3);margin-top:1px}

/* ── CENTER: STEP CONTENT ── */
.step-content{flex:1;overflow:hidden;display:flex;flex-direction:column;background:var(--bg)}
.sc-header{background:var(--surface);padding:12px 18px 11px;border-bottom:1px solid var(--border);
  flex-shrink:0;display:flex;align-items:center;gap:12px}
.sc-step-num{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;
  color:var(--muted);white-space:nowrap}
.sc-step-title{font-size:15px;font-weight:800;color:var(--text);letter-spacing:-.2px;flex:1}
.sc-step-desc{font-size:11px;color:var(--muted);white-space:nowrap}
.sc-actions{display:flex;gap:6px}
.sc-btn{padding:5px 13px;border-radius:5px;font-size:12px;font-weight:600;
  cursor:pointer;border:none;font-family:inherit;transition:all .12s}
.sc-btn.sec{background:#f1f5f9;border:1px solid var(--border);color:var(--muted)}
.sc-btn.pri{background:var(--blue);color:#fff}
.sc-btn.grn{background:var(--green);color:#fff}
.sc-btn:hover{opacity:.85}
.sc-body{flex:1;overflow-y:auto;padding:16px 18px}
.sc-body::-webkit-scrollbar{width:4px}
.sc-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;
  margin-bottom:12px;overflow:hidden}
.card-hdr{padding:9px 14px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;background:#fafbfc}
.card-title{font-size:11px;font-weight:700;color:var(--text);
  text-transform:uppercase;letter-spacing:.4px}
.card-body{padding:12px 14px}

/* form controls */
.form-row{display:flex;gap:10px;align-items:flex-end;margin-bottom:10px}
.fg{display:flex;flex-direction:column;gap:3px}
.fg label{font-size:10px;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.4px}
.fc{padding:5px 9px;border:1px solid var(--border);border-radius:5px;
  font-size:12px;color:var(--text);background:var(--surface);outline:none;
  transition:border-color .12s;font-family:inherit}
.fc:focus{border-color:var(--blue)}
select.fc{cursor:pointer}

/* info grids */
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.info-grid.two{grid-template-columns:1fr 1fr}
.info-grid.four{grid-template-columns:repeat(4,1fr)}
.info-item label{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.5px;
  color:var(--muted);margin-bottom:3px;font-weight:600}
.info-item .val{font-size:13px;font-weight:700;color:var(--text)}
.info-item .val.blue{color:var(--blue)}
.info-item .val.green{color:var(--green)}

/* tags */
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{padding:2px 7px;background:#f1f5f9;border:1px solid var(--border);
  border-radius:4px;font-size:10px;color:var(--muted);font-weight:500}
.tag.warn{background:#fffbeb;border-color:#fde68a;color:#92400e}
.tag.crit{background:#fef2f2;border-color:#fecaca;color:#991b1b}

/* material ranked list */
.mat-option{padding:10px 14px;border:1px solid var(--border);border-radius:6px;
  margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:10px;
  transition:all .12s;background:var(--surface)}
.mat-option:hover{border-color:var(--blue);background:var(--blue-lt)}
.mat-option.selected{border-color:var(--blue);background:var(--blue-lt)}
.mat-option.warn{border-color:#fde68a;background:#fffbeb}
.mat-option.invalid{border-color:var(--border);background:#fafbfc;opacity:.6}
.mat-radio{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);
  flex-shrink:0;display:flex;align-items:center;justify-content:center}
.mat-option.selected .mat-radio{border-color:var(--blue)}
.mat-option.selected .mat-radio::after{content:'';width:8px;height:8px;
  border-radius:50%;background:var(--blue)}
.mat-info{flex:1}
.mat-name{font-size:13px;font-weight:700;color:var(--text)}
.mat-spec{font-size:11px;color:var(--muted);margin-top:2px}
.mat-flag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;flex-shrink:0}
.mat-flag.ok{background:#dcfce7;color:#15803d}
.mat-flag.warn{background:#fef9c3;color:#a16207}
.mat-flag.invalid{background:#f1f5f9;color:var(--muted)}

/* ops table */
.ops-wrap{overflow-x:auto}
.ops-table{width:100%;border-collapse:collapse;min-width:520px}
.ops-table th{padding:7px 9px;text-align:left;font-size:9px;font-weight:700;
  text-transform:uppercase;letter-spacing:.5px;color:var(--muted);
  border-bottom:1px solid var(--border);background:#fafbfc;white-space:nowrap}
.ops-table th.r,.ops-table td.r{text-align:right}
.ops-table td{padding:7px 9px;border-bottom:1px solid #f1f5f9;font-size:12px;
  vertical-align:middle}
.ops-table tr:last-child td{border-bottom:none}
.ops-table tr:hover td{background:#fafbfc}
.ops-table tfoot td{background:#fafbfc;border-top:2px solid var(--border);font-weight:700}
.op-num{font-size:10px;font-weight:800;color:var(--muted);width:28px}
.ii{padding:3px 6px;border:1px solid transparent;border-radius:4px;
  font-size:12px;color:var(--text);background:transparent;outline:none;
  width:70px;text-align:right;transition:all .1s;font-family:inherit}
.ii:hover{border-color:var(--border);background:var(--surface)}
.ii:focus{border-color:var(--blue);background:var(--surface);
  box-shadow:0 0 0 2px rgba(37,99,235,.1)}
.ii.name{width:130px;text-align:left}
select.ii{cursor:pointer;width:130px;text-align:left}
.add-op{display:flex;align-items:center;gap:5px;padding:6px 12px;
  background:none;border:1px dashed var(--border);border-radius:5px;
  color:var(--muted);font-size:12px;cursor:pointer;width:100%;margin-top:8px;
  transition:all .12s;font-family:inherit}
.add-op:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-lt)}

/* balloon / DFM table */
.balloon-table{width:100%;border-collapse:collapse}
.balloon-table th{padding:6px 8px;text-align:left;font-size:9px;font-weight:700;
  text-transform:uppercase;letter-spacing:.5px;color:var(--muted);
  border-bottom:1px solid var(--border);background:#fafbfc;white-space:nowrap}
.balloon-table td{padding:6px 8px;border-bottom:1px solid #f8fafc;font-size:11px;
  vertical-align:middle}
.balloon-table tr:hover td{background:#fafbfc}
.balloon-table tr.dfm-crit td{background:#fef2f2}
.balloon-table tr.dfm-warn td{background:#fffbeb}
.balloon-ref{font-size:10px;font-weight:700;background:#f1f5f9;padding:2px 6px;
  border-radius:3px;color:var(--muted);font-family:monospace}
.tol-val{font-family:monospace;font-size:11px;font-weight:600}
.tol-val.tight{color:var(--red);background:#fef2f2;padding:1px 5px;border-radius:3px}
.tol-val.moderate{color:var(--amber);background:#fffbeb;padding:1px 5px;border-radius:3px}
.dfm-badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:3px;
  text-transform:uppercase;letter-spacing:.3px}
.dfm-badge.critical{background:#fecaca;color:#991b1b}
.dfm-badge.warning{background:#fde68a;color:#92400e}
.dfm-badge.info{background:#bfdbfe;color:#1e40af}
.check-cell{width:28px;text-align:center;font-size:13px;cursor:pointer;color:var(--muted)}
.check-cell.checked{color:var(--green)}

/* dfm risk cards */
.dfm-risk{padding:10px 12px;border-radius:6px;margin-bottom:7px;
  display:flex;align-items:flex-start;gap:8px;border:1px solid}
.dfm-risk.critical{background:#fef2f2;border-color:#fecaca}
.dfm-risk.warning{background:#fffbeb;border-color:#fde68a}
.dfm-risk.info{background:#eff6ff;border-color:#bfdbfe}
.dfm-risk-icon{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:9px;font-weight:800;flex-shrink:0;margin-top:1px}
.critical .dfm-risk-icon{background:var(--red);color:#fff}
.warning .dfm-risk-icon{background:var(--amber);color:#fff}
.info .dfm-risk-icon{background:var(--blue);color:#fff}
.dfm-risk-body{flex:1}
.dfm-risk-desc{font-size:12px;font-weight:500;color:var(--text);line-height:1.4;margin-bottom:5px}
.dfm-risk-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dfm-cost-tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px}
.critical .dfm-cost-tag{background:#fecaca;color:#991b1b}
.warning .dfm-cost-tag{background:#fde68a;color:#92400e}
.info .dfm-cost-tag{background:#bfdbfe;color:#1e40af}
.tog-wrap{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);
  cursor:pointer;user-select:none}
.tog{width:28px;height:15px;background:#cbd5e1;border-radius:8px;position:relative;
  transition:background .15s;cursor:pointer;flex-shrink:0}
.tog.on{background:var(--blue)}
.tog::after{content:'';position:absolute;width:11px;height:11px;background:#fff;
  border-radius:50%;top:2px;left:2px;transition:left .15s}
.tog.on::after{left:15px}

/* redline rows */
.redline-row{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start}
.redline-row .fg{flex:1}
.redline-cat select{width:150px}

/* checkbox groups */
.check-group{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.check-item{display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none;
  font-size:12px;color:var(--text)}
.check-item input[type=checkbox]{accent-color:var(--blue);width:14px;height:14px;cursor:pointer}

/* button groups */
.btn-group{display:flex;gap:4px;flex-wrap:wrap}
.btn-opt{padding:5px 12px;border:1px solid var(--border);border-radius:5px;
  font-size:11px;font-weight:600;cursor:pointer;color:var(--muted);
  background:var(--surface);transition:all .1s;font-family:inherit}
.btn-opt.active{background:var(--blue-lt);border-color:var(--blue);color:var(--blue)}
.btn-opt:hover:not(.active){background:#f8fafc}

/* cost summary in export step */
.cost-line{display:flex;justify-content:space-between;align-items:center;
  padding:5px 0;font-size:12px;border-bottom:1px solid #f8fafc}
.cost-line:last-child{border-bottom:none}
.cost-line .lbl{color:var(--muted)}
.cost-line .amt{font-weight:700}
.price-box{background:linear-gradient(135deg,#1d4ed8,#2563eb);border-radius:8px;
  padding:14px 16px;color:#fff;margin-bottom:12px}
.price-box-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.7px;opacity:.65;margin-bottom:3px}
.price-box-val{font-size:28px;font-weight:800;letter-spacing:-1px}
.price-box-sub{font-size:10px;opacity:.6;margin-top:2px}
.margin-ctl label{display:flex;justify-content:space-between;font-size:11px;
  font-weight:600;color:var(--muted);margin-bottom:5px}
.margin-ctl label span{font-weight:800;color:var(--text)}
input[type=range]{width:100%;accent-color:var(--blue);cursor:pointer}

/* ── RIGHT: VIEWER ── */
.viewer{width:440px;flex-shrink:0;background:var(--viewer);display:flex;
  flex-direction:column;overflow:hidden;border-left:1px solid #080d18}
.viewer-toolbar{background:#0d1726;padding:7px 10px;display:flex;align-items:center;
  gap:8px;border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0}
.vt-file{font-size:10px;color:rgba(255,255,255,.35);font-family:monospace;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vt-toggle{display:flex;gap:2px}
.vt-btn{padding:3px 9px;font-size:10px;font-weight:700;border-radius:4px;cursor:pointer;
  border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);
  color:rgba(255,255,255,.45);transition:all .12s;font-family:inherit}
.vt-btn.active{background:var(--blue);border-color:var(--blue);color:#fff}
.vt-btn:hover:not(.active){background:rgba(255,255,255,.12);color:rgba(255,255,255,.8)}

/* PDF pane */
.pdf-pane{flex:1;overflow:hidden;display:flex;flex-direction:column;
  border-bottom:2px solid rgba(255,255,255,.06);min-height:0}
.pdf-pane.full{flex:2}
.pdf-pane.hidden{display:none}
.pdf-pane-bar{background:#0d1726;padding:4px 10px;display:flex;align-items:center;
  gap:6px;border-bottom:1px solid rgba(255,255,255,.05);flex-shrink:0}
.pdf-pane-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;
  color:rgba(255,255,255,.25);flex:1}
.pdf-nav-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);
  border-radius:3px;color:rgba(255,255,255,.4);font-size:10px;padding:2px 7px;
  cursor:pointer;font-family:inherit}
.pdf-nav-btn:hover{background:rgba(255,255,255,.12)}
.pdf-page-info{font-size:10px;color:rgba(255,255,255,.25)}
.pdf-canvas{flex:1;overflow:auto;display:flex;align-items:flex-start;
  justify-content:center;padding:8px}
.pdf-canvas::-webkit-scrollbar{width:3px;height:3px}
.pdf-canvas::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}

/* STEP model pane */
.model-pane{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.model-pane.full{flex:2}
.model-pane.hidden{display:none}
.model-pane-bar{background:#0d1726;padding:4px 10px;display:flex;align-items:center;
  gap:6px;border-bottom:1px solid rgba(255,255,255,.05);flex-shrink:0}
.model-pane-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;

// ─────────────────────────────────────────────
// COST CALC
// ─────────────────────────────────────────────
function calcMatCost(item){
  const m=MATERIALS[item.mat]; if(!m) return 0;
  const [w,h,l]=item.stock;
  return w*h*l*m.density*m.cpp*(item.scrap||1.05);
}
function calcOpCost(op,qty){ return ((op.su/qty)+op.cy)*op.rate; }
function calcMachCost(item,qty){ return item.ops.reduce((s,op)=>s+calcOpCost(op,qty),0); }
function calcDFMCost(item){ return (item.dfm||[]).filter(f=>f.on).reduce((s,f)=>s+f.cost,0); }
function calcExtras(item){
  if(item.type!=='make') return 0;
  return (item.quality?.costAdder||0)+(item.marking?.costAdder||0)+(item.packaging?.costAdder||0);
}
function calcItemCost(item,qty){
  if(item.type==='make') return calcMatCost(item)+calcMachCost(item,qty)+calcDFMCost(item)+calcExtras(item);
  return item.unitCost||0;
}
function calcAll(qty){
  const vs=Object.values(items);
  const make=vs.filter(i=>i.type==='make').reduce((s,i)=>s+calcItemCost(i,qty),0);
  const buy =vs.filter(i=>i.type==='buy').reduce((s,i)=>s+calcItemCost(i,qty),0);
  const osp =vs.filter(i=>i.type==='osp').reduce((s,i)=>s+calcItemCost(i,qty),0);
  return {make,buy,osp,total:make+buy+osp};
}
function quotePrice(cost){ return cost/(1-state.margin); }

// ─────────────────────────────────────────────
// STEP STATUS
// ─────────────────────────────────────────────
function getStepStatus(item, stepKey){
  if(item.type==='make'){
    const s = item.status;
    switch(stepKey){
      case 'material':   return item.mat ? 'ok' : 'ns';
      case 'stock':      return item.stock?.every(v=>v>0) ? 'ok' : 'ns';
      case 'operations': return item.ops?.length>0 ? 'ok' : 'ns';
      case 'dfm': {
        const crit=item.dfm?.filter(f=>f.sev==='critical'&&f.on).length;
        const warn=item.dfm?.filter(f=>f.sev==='warning'&&f.on).length;
        return crit?'crit':warn?'warn':'ok';
      }
      case 'specs':      return 'ok';
      case 'quality':    return item.quality?.inspLevel ? 'ok' : 'ns';
      case 'marking':    return item.marking?.method ? 'ok' : 'ns';
      case 'packaging':  return item.packaging?.type ? 'ok' : 'ns';
      case 'export':     return s==='complete'?'ok':'ns';
    }
  }
  if(item.type==='buy'){
    switch(stepKey){
      case 'details': return item.unitCost>0?'ok':'ns';
      case 'quality': return item.quality?.certs?.length>0?'ok':'ns';
      case 'export':  return item.status==='complete'?'ok':'ns';
    }
  }
  if(item.type==='osp'){
    switch(stepKey){
      case 'details': return item.unitCost>0?'ok':'ns';
      case 'quality': return item.quality?.cert?'ok':'ns';
      case 'export':  return item.status==='complete'?'ok':'ns';
    }
  }
  return 'ns';
}
function getStepBadge(item, stepKey){
  const s=getStepStatus(item,stepKey);
  if(s==='crit') return '<span class="sbadge req">Required</span>';
  if(s==='warn') return '<span class="sbadge update">Review</span>';
  if(s==='ns' && stepKey===state.activeStep) return '';
  if(s==='ns') return '<span class="sbadge new">New</span>';
  return '';
}
function getSteps(item){
  return item.type==='make'?MAKE_STEPS:item.type==='buy'?BUY_STEPS:OSP_STEPS;
}

function renderStepList(){
  const item=items[state.activeId];
  const steps=getSteps(item);
  const list=document.getElementById('stepList');
  list.innerHTML=steps.map((s,i)=>{
    const st=getStepStatus(item,s.key);
    const isActive=state.activeStep===s.key;
    const badge=getStepBadge(item,s.key);
    const circleClass=isActive?'active':st==='ok'?'ok':st==='warn'?'warn':st==='crit'?'crit':'';
    const circleContent=st==='ok'&&!isActive?'✓':st==='warn'?'!':st==='crit'?'!':String(i+1);
    return `<div class="step-item${isActive?' active':''}${st==='ok'?' ok':''}" onclick="setStep('${s.key}')">
      <div class="step-circle ${circleClass}">${circleContent}</div>
      <div class="step-info">
        <div class="step-item-name">${s.label}</div>
        ${badge?`<div class="step-badges">${badge}</div>`:''}
      </div>
    </div>`;
  }).join('');
  // part selector
  document.getElementById('partSelName').textContent=item.name;
  document.getElementById('partSelPn').textContent=`${item.pn} · ${item.type.charAt(0).toUpperCase()+item.type.slice(1)}`;
  // cost footer
  const cost=calcItemCost(item,state.qty);
  const total=calcAll(state.qty).total;
  document.getElementById('sfCost').textContent='$'+cost.toFixed(2);
  document.getElementById('sfSub').textContent=`of $${total.toFixed(2)} assembly total`;
}

    else if(key==='operations') body.innerHTML=renderOps(item);
    else if(key==='dfm')   body.innerHTML=renderDFM(item);
    else if(key==='specs') body.innerHTML=renderSpecs(item);
    else if(key==='quality')   body.innerHTML=renderQuality(item);

    else if(key==='packaging') body.innerHTML=renderPackaging(item);

function renderExport(item){
  const qty=state.qty;
  const mc=calcMatCost(item);
  const mach=item.ops?calcMachCost(item,qty):0;
  const dfm=item.dfm?calcDFMCost(item):0;
  const ext=calcExtras(item);
  const total=calcItemCost(item,qty);
  const pct=Math.round(state.margin*100);
  const qp=total/(1-state.margin);
  const totalAll=calcAll(qty);
  return `
  <div class="card">
    <div class="card-hdr"><span class="card-title">Part Cost Breakdown</span></div>
    <div class="card-body">
      ${item.type==='make'?`
        <div class="cost-line"><span class="lbl">Material</span><span class="amt">$${mc.toFixed(2)}</span></div>
        <div class="cost-line"><span class="lbl">Machining (${qty}× amortized)</span><span class="amt">$${mach.toFixed(2)}</span></div>
        <div class="cost-line"><span class="lbl">DFM / Special Ops</span><span class="amt">$${dfm.toFixed(2)}</span></div>
        <div class="cost-line"><span class="lbl">Quality + Marking + Packaging</span><span class="amt">$${ext.toFixed(2)}</span></div>
        <div class="cost-line" style="border-top:2px solid var(--border);margin-top:4px;padding-top:8px">
          <span style="font-weight:700;color:var(--text)">Total Part Cost</span>
          <span style="font-weight:800;font-size:15px">$${total.toFixed(2)}</span>
        </div>`
      :`<div class="cost-line"><span class="lbl">Unit Cost</span><span class="amt">$${total.toFixed(2)}</span></div>`}
    </div>
  </div>
  <div class="card">
    <div class="card-hdr"><span class="card-title">Assembly Total</span></div>
    <div class="card-body">
      <div class="cost-line"><span class="lbl">Make Items</span><span class="amt">$${totalAll.make.toFixed(2)}</span></div>
      <div class="cost-line"><span class="lbl">Buy Items</span><span class="amt">$${totalAll.buy.toFixed(2)}</span></div>
      <div class="cost-line"><span class="lbl">Outside Process</span><span class="amt">$${totalAll.osp.toFixed(2)}</span></div>
      <div class="margin-ctl" style="margin-top:12px">
        <label>Margin <span id="marginPct">${pct}%</span></label>
        <input type="range" min="0" max="70" value="${pct}" oninput="setMargin(this.value/100)">
      </div>
      <div class="price-box" style="margin-top:4px">
        <div class="price-box-lbl">Assembly Quote Price (${qty}×)</div>
        <div class="price-box-val" id="quotePriceVal">$${quotePrice(totalAll.total).toFixed(2)}</div>
        <div class="price-box-sub">${pct}% margin · $${(quotePrice(totalAll.total)/qty).toFixed(2)}/pc</div>
      </div>
      <div style="margin-top:8px;display:flex;gap:8px">
        <div class="fg" style="flex:1"><label>Lead Time</label>
          <select class="fc" onchange="state.leadTime=this.value">
            ${['1-2wk','3-4wk','6-8wk','Custom'].map(o=>`<option${state.leadTime===o?' selected':''}>${o}</option>`).join('')}
          </select>
        </div>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-hdr"><span class="card-title">Quoter Notes</span></div>
    <div class="card-body">
      <textarea class="fc" rows="4" style="width:100%;resize:vertical;font-size:12px;line-height:1.5"
        placeholder="Assumptions, open questions, vendor quotes…"
        onchange="items['${item.id}'].notes=this.value">${item.notes}</textarea>
    </div>
  </div>`;
}

// ─────────────────────────────────────────────
// EVENT HANDLERS
// ─────────────────────────────────────────────
function selectItem(id){
  state.activeId=id;
  const item=items[id];
  const steps=getSteps(item);
  state.activeStep=steps[0].key;
  updateViewerForItem(item);
  refreshAll();
}

function setStep(key){
  state.activeStep=key;
  refreshAll();
}

function setQty(q){
  state.qty=q;
  document.querySelectorAll('.qty-btn').forEach(b=>b.classList.toggle('active',+b.textContent===q));
  refreshAll();
}

function setMargin(v){
  state.margin=v;
  document.getElementById('marginPct').textContent=Math.round(v*100)+'%';
  const total=calcAll(state.qty).total;
  const qpEl=document.getElementById('quotePriceVal');
  if(qpEl) qpEl.textContent='$'+quotePrice(total).toFixed(2);
}

function nextStep(){
  const item=items[state.activeId];
  const steps=getSteps(item);
  const idx=steps.findIndex(s=>s.key===state.activeStep);
  if(idx<steps.length-1){ state.activeStep=steps[idx+1].key; refreshAll(); }
}

function prevStep(){
  const item=items[state.activeId];
  const steps=getSteps(item);
  const idx=steps.findIndex(s=>s.key===state.activeStep);
  if(idx>0){ state.activeStep=steps[idx-1].key; refreshAll(); }
}

function markComplete(){
  items[state.activeId].status='complete';
  // advance to next item
  const ids=Object.keys(items);
  const next=ids[ids.indexOf(state.activeId)+1];
  if(next) selectItem(next);
  else refreshAll();
}

function updateOp(el){
  const item=items[el.dataset.id];
  const op=item.ops.find(o=>o.id===el.dataset.op);
  if(!op) return;
  const field=el.dataset.field;
  if(field==='name') op.name=el.value;
  else if(field==='mach'){op.mach=el.value;op.rate=MACHINES[el.value]||op.rate;}
  else op[field]=parseFloat(el.value)||0;
  refreshCosts();
}

function addOp(id){
  const item=items[id];
  const last=item.ops[item.ops.length-1];
  const nextNum=last?String(+last.op+10).padStart(2,'0'):'10';
  item.ops.push({id:'o'+Date.now(),op:nextNum,name:'New Operation',mach:'3-Axis VMC',su:.5,cy:.5,rate:125});
  refreshAll();
}

function toggleDFM(el){
  const item=items[el.dataset.id];
  const flag=item.dfm.find(f=>f.id===el.dataset.dfm);
  if(!flag) return;
  flag.on=!flag.on;
  el.classList.toggle('on',flag.on);
  el.nextElementSibling.textContent=flag.on?'Included':'Excluded';
  const te=document.getElementById('dfmTotal-'+item.id);
  if(te) te.textContent=calcDFMCost(item).toFixed(2);
  refreshCosts();
}

function selectMat(id,matKey){
  items[id].mat=matKey;
  const mat=MATERIALS[matKey];
  const cpp=document.getElementById('matCpp-'+id);
  if(cpp&&mat) cpp.value='$'+mat.cpp.toFixed(2);
  refreshCosts();
}

function updateStock(el){
  const id=el.dataset.id;
  const item=items[id];
  const w=parseFloat(document.getElementById('sw')?.value)||0;
  const h=parseFloat(document.getElementById('sh')?.value)||0;
  const l=parseFloat(document.getElementById('sl')?.value)||0;
  const sc=parseFloat(document.getElementById('sscrap')?.value)||1.05;
  item.stock=[w,h,l];item.scrap=sc;
  const mat=MATERIALS[item.mat];
  const wt=mat?w*h*l*mat.density:0;
  const wte=document.getElementById('stockWt-'+id);
  const mce=document.getElementById('matCostDisp-'+id);
  if(wte) wte.textContent=wt.toFixed(2)+' lb';
  if(mce) mce.textContent='$'+calcMatCost(item).toFixed(2);
  refreshCosts();
}

function setQualField(id,field,val){
  items[id].quality[field]=val;
  document.querySelectorAll(`#inspLvl-${id} .btn-opt, #dimMeth-${id} .btn-opt`).forEach(b=>{
    if(b.textContent.toLowerCase().replace(/ /g,'-')===val||
       b.onclick?.toString().includes(`'${val}'`)) b.classList.add('active');
  });
  refreshAll();
}

function toggleCert(id,cert,checked){
  const q=items[id].quality;
  if(!q.certs) q.certs=[];
  if(checked){if(!q.certs.includes(cert)) q.certs.push(cert);}
  else q.certs=q.certs.filter(c=>c!==cert);
}

function setMarkField(id,field,val){
  items[id].marking[field]=val;
  refreshAll();
}

function toggleMarkContent(id,c,checked){
  const mk=items[id].marking;
  if(!mk.content) mk.content=[];
  if(checked){if(!mk.content.includes(c)) mk.content.push(c);}
  else mk.content=mk.content.filter(x=>x!==c);
}

function setPkgField(id,field,val){
  items[id].packaging[field]=val;
  refreshAll();
}

function toggleHandling(id,h,checked){
  const pk=items[id].packaging;
  if(!pk.handling) pk.handling=[];
  if(checked){if(!pk.handling.includes(h)) pk.handling.push(h);}
  else pk.handling=pk.handling.filter(x=>x!==h);
}

function setView(mode){
  state.viewMode=mode;
  document.querySelectorAll('.vt-btn').forEach(b=>b.classList.toggle('active',b.textContent.toLowerCase()===mode));
  const pdf=document.getElementById('pdfPane');
  const mdl=document.getElementById('modelPane');
  if(mode==='pdf'){pdf.className='pdf-pane full';mdl.className='model-pane hidden';}
  else if(mode==='model'){pdf.className='pdf-pane hidden';mdl.className='model-pane full';}
  else{pdf.className='pdf-pane';mdl.className='model-pane';}
}

function updateViewerForItem(item){
  const fn=document.getElementById('vtFile');
  if(fn) fn.textContent=item.pn+'_RevB.'+(item.type==='make'?'step':'pdf');
  const mm=document.getElementById('modelMeta');
  if(mm&&item.features){
    const f=item.features;
    mm.innerHTML=`${f.bb}<br>${f.mrPct}% mat. removal<br>${f.threads} threads · ${f.bores} bores`;
  }
}

function refreshCosts(){
  renderStepList();
}

function bindListeners(item){/* all inline */}

// ─────────────────────────────────────────────
// MAIN RENDER
// ─────────────────────────────────────────────
function refreshAll(){
  renderPartDropdown();
  renderStepList();
  renderStepHeader();
  renderStepContent();
}

// click outside closes dropdown
document.addEventListener('click',e=>{
  if(!e.target.closest('.part-sel')) document.getElementById('partDropdown').classList.remove('open');
});

refreshAll();
</script>
